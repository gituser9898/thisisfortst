<script>
// Derive _COLS / _ROWS / _FRAMES / _FPS constants from the embedded pack-config.
// _FPS is optional per asset — if pack-config doesn't specify one, the
// default below is used (same values the game always shipped with).
(function () {
  const cfg = JSON.parse(document.getElementById('pack-config').textContent);
  const FPS_DEFAULTS = { ARROW: 10, SPEAR: 10, SHIELD: 12, EAGLE: 12, COIN: 16, HAND: 6 };
  for (const [key, val] of Object.entries(cfg.assets)) {
    const stem = key.replace(/_SRC$/, '');
    if (val.cols   !== undefined) window[stem + '_COLS']   = val.cols;
    if (val.rows   !== undefined) window[stem + '_ROWS']   = val.rows;
    if (val.frames !== undefined) window[stem + '_FRAMES'] = val.frames;
    if (FPS_DEFAULTS[stem] !== undefined) {
      window[stem + '_FPS'] = (val.fps !== undefined) ? val.fps : FPS_DEFAULTS[stem];
    }
  }
})();

// Build a flat frame-name -> {page,x,y,w,h} lookup from the embedded atlas
// page JSON (standard TexturePacker "array" format, one entry per atlas page).
const ATLAS_SRCS = ["atlas0.png"];
// Resolution tiers, filled in by build_atlas.py when assets are external.
// Each entry: { name, scale, srcs:[...], meta:[...] }. Empty means "use
// ATLAS_SRCS and the embedded atlas-data as the only tier".
const ATLAS_TIERS = [];
// Screen height (in device pixels) at or above which the next tier up is
// used. Tuned so phones get a third or two thirds and desktops get full.
const ATLAS_TIER_STEPS = [900, 1500];

window.ATLAS_PAGES = [];
window.ATLAS_LOOKUP = {};
window.ATLAS_ACTIVE_SRCS = null;

// Picks a resolution tier from the real device pixel height. A small phone
// never downloads (or decodes) the full-size atlas, which is the bulk of
// both the transfer and the load time.
function pickAtlasTier() {
  if (!ATLAS_TIERS || !ATLAS_TIERS.length) return null;
  const px = Math.round(Math.max(window.screen ? window.screen.height : window.innerHeight,
                                 window.innerHeight) * (window.devicePixelRatio || 1));
  let idx = 0;
  for (let i = 0; i < ATLAS_TIER_STEPS.length; i++) {
    if (px >= ATLAS_TIER_STEPS[i]) idx = i + 1;
  }
  return ATLAS_TIERS[Math.min(idx, ATLAS_TIERS.length - 1)];
}
(function () {
  let pages = [];
  const tier = pickAtlasTier();
  if (tier && tier.meta) {
    pages = tier.meta;
    window.ATLAS_ACTIVE_SRCS = tier.srcs;
  } else {
    try { pages = JSON.parse(document.getElementById('atlas-data').textContent) || []; } catch (e) { pages = []; }
  }
  window.ATLAS_PAGES = pages;
  pages.forEach((page, pageIndex) => {
    (page.frames || []).forEach(f => {
      const r = f.frame || {};
      const c = f.content || { w: r.w, h: r.h };
      // x/y stay the square's top-left; w/h are the REAL content size (the
      // square may be padded larger for atlas uniformity, but content is
      // always anchored at the frame's top-left, so this sub-rect is exactly
      // the original, unpadded pixels).
      window.ATLAS_LOOKUP[f.filename] = { page: pageIndex, x: r.x, y: r.y, w: c.w, h: c.h };
    });
  });
})();

// Rebuild the original flat cols x rows spritesheet textures (arrowsheet,
// spearsheet, shieldsheet, eaglesheet, coinsheet, handsheet) from frames
// packed inside the embedded atlas page(s). Every other line of game code
// keeps reading these textures exactly as it always has.
function rebuildAtlasSheets(scene) {
  const specs = [
    ["ARROW", "arrowsheet", true],
    ["SPEAR", "spearsheet", typeof SPEAR_ON !== "undefined" ? SPEAR_ON : true],
    ["SHIELD", "shieldsheet", typeof SHIELD_ON !== "undefined" ? SHIELD_ON : true],
    ["EAGLE", "eaglesheet", typeof EAGLE_ON !== "undefined" ? EAGLE_ON : true],
    ["COIN", "coinsheet", typeof COIN_ON !== "undefined" ? COIN_ON : true],
    ["HAND", "handsheet", typeof HAND_ON !== "undefined" ? HAND_ON : true]
  ];
  specs.forEach(([stem, key, on]) => {
    if (!on) return;
    const cols = window[stem + "_COLS"], rows = window[stem + "_ROWS"], frames = window[stem + "_FRAMES"];
    if (!cols || !rows || !frames) return;
    const f0 = window.ATLAS_LOOKUP[stem + "_0"];
    if (!f0) return;
    const fw = f0.w, fh = f0.h;
    if (!fw || !fh) return;
    const c = document.createElement("canvas");
    c.width = fw * cols;
    c.height = fh * rows;
    const cx = c.getContext("2d");
    let drew = 0;
    for (let i = 0; i < frames; i++) {
      const fr = window.ATLAS_LOOKUP[stem + "_" + i];
      if (!fr) continue;
      // If the atlas page failed to load (e.g. blocked by file:// CORS),
      // bail out rather than handing Phaser a blank/invalid texture, which
      // would surface later as a null-frame "sourceSize" crash.
      const pageKey = "gameAtlas" + fr.page;
      if (!scene.textures.exists(pageKey)) return;
      const raw = scene.textures.get(pageKey).getSourceImage();
      if (!raw || !raw.width) return;
      const col = i % cols, row = Math.floor(i / cols);
      cx.drawImage(raw, fr.x, fr.y, fr.w, fr.h, col * fw, row * fh, fr.w, fr.h);
      drew++;
    }
    if (!drew) return;
    if (scene.textures.exists(key)) scene.textures.remove(key);
    scene.textures.addCanvas(key, c);
  });
}

// High-quality progressive downscale (mirrors the per-sprite mini()/miniSheet()
// baking already used elsewhere) so UI images never rely on a plain GPU
// setScale() shrink, which aliases/looks jaggy for a big reduction.
function bakeToSize(img, sw, sh, tw, th) {
  tw = Math.max(1, Math.round(tw));
  th = Math.max(1, Math.round(th));
  let cw = sw, ch = sh;
  let c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  let cx = c.getContext("2d");
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, 0, 0, sw, sh, 0, 0, cw, ch);
  while (cw > tw * 2 && ch > th * 2) {
    const nw = Math.max(tw, cw >> 1), nh = Math.max(th, ch >> 1);
    const d = document.createElement("canvas");
    d.width = nw; d.height = nh;
    const dx = d.getContext("2d");
    dx.imageSmoothingEnabled = true;
    dx.imageSmoothingQuality = "high";
    dx.drawImage(c, 0, 0, cw, ch, 0, 0, nw, nh);
    c = d; cw = nw; ch = nh;
  }
  const out = document.createElement("canvas");
  out.width = tw; out.height = th;
  const ox = out.getContext("2d");
  ox.imageSmoothingEnabled = true;
  ox.imageSmoothingQuality = "high";
  ox.drawImage(c, 0, 0, cw, ch, 0, 0, tw, th);
  return out;
}

// Rebake a scene image's texture to an exact pixel size (instead of GPU
// setScale-ing it), reusing the same baked canvas if the target size hasn't
// changed since last call.
// Replaces a canvas texture's pixels WITHOUT destroying and recreating the
// texture. textures.remove() destroys the Texture and its Frames, and any
// sprite still pointing at a destroyed Frame crashes on the next render
// ("cannot read properties of null (reading 'sourceSize')"). Updating in
// place keeps every existing reference valid.
function putCanvasTexture(scene, key, canvas) {
  const tm = scene.textures;
  if (tm.exists(key)) {
    const tex = tm.get(key);
    // Only update in place when the dimensions already match. setSize()
    // tears down and recreates the GL texture, which can leave anything
    // pointing at it with a null glTexture; a plain redraw + refresh does
    // not touch the GL object at all.
    if (tex && tex.canvas && tex.context &&
        tex.canvas.width === canvas.width && tex.canvas.height === canvas.height) {
      tex.context.clearRect(0, 0, canvas.width, canvas.height);
      tex.context.drawImage(canvas, 0, 0);
      tex.refresh();
      return tex;
    }
    tm.remove(key);
  }
  return tm.addCanvas(key, canvas);
}

// Phaser's AnimationManager is GLOBAL, not per-scene. Re-entering a scene
// re-runs create() and hits "key already exists", leaving the OLD animation
// in place -- and that old animation still points at frames from a texture
// that has since been rebuilt, which crashes on the next render
// ("cannot read properties of null (reading 'sourceSize')"). Always remove
// before creating so the animation matches the current texture.
function makeAnim(scene, cfg) {
  if (!cfg || !cfg.key) return null;
  if (scene.anims.exists(cfg.key)) scene.anims.remove(cfg.key);
  return scene.anims.create(cfg);
}

function bakeImageTo(scene, img, rawKey, bakedKey, tw, th, stateProp) {
  if (!img || !scene.textures.exists(rawKey)) return;
  const raw = scene.textures.get(rawKey).getSourceImage();
  tw = Math.max(1, Math.round(tw));
  th = Math.max(1, Math.round(th));
  const state = scene[stateProp] || (scene[stateProp] = {});
  if (state.w !== tw || state.h !== th) {
    const baked = bakeToSize(raw, raw.width, raw.height, tw, th);
    putCanvasTexture(scene, bakedKey, baked);
    img.setTexture(bakedKey);
    state.w = tw;
    state.h = th;
  }
  img.setScale(1);
}
// from the atlas the same way, one frame each, no grid involved.
function rebuildAtlasImages(scene) {
  const specs = [
    ["BG", "sky", true],
    ["SCORE", "plate", true],
    ["PAUSE", "pausebtn", true],
    ["PLAY_BTN", "playbtn", typeof PLAY_BTN_ON !== "undefined" ? PLAY_BTN_ON : true],
    ["BOARD_BTN", "boardbtn", typeof BOARD_BTN_ON !== "undefined" ? BOARD_BTN_ON : true],
    ["RESUME_BTN", "resumebtn", true],
    ["MENU_BTN", "menubtn", true],
    ["TUTORIAL", "tutoricon", true],
    ["TUTORIAL_LOGO", "tutlogo", true],
    ["RESTART_BTN", "restartbtn", true]
  ];
  specs.forEach(([stem, key, on]) => {
    if (!on) return;
    const f0 = window.ATLAS_LOOKUP[stem + "_0"];
    if (!f0 || !f0.w || !f0.h) return;
    const pageKey = "gameAtlas" + f0.page;
    if (!scene.textures.exists(pageKey)) return;
    const raw = scene.textures.get(pageKey).getSourceImage();
    if (!raw || !raw.width) return;
    const c = document.createElement("canvas");
    c.width = f0.w;
    c.height = f0.h;
    c.getContext("2d").drawImage(raw, f0.x, f0.y, f0.w, f0.h, 0, 0, f0.w, f0.h);
    if (scene.textures.exists(key)) scene.textures.remove(key);
    scene.textures.addCanvas(key, c);
  });
}


const Ancient_FONT = 'AncientFont';


// Filled in by build_atlas.py from the "baseUrl" field in pack-config. When
// set (and the game was built in loading mode), every non-embedded asset is
// fetched from this prefix instead of from next to game.html, so assets can
// live on a CDN or separate host.
const ASSET_BASE_URL = "";

// Resolves an asset reference to something the browser can actually fetch.
// Data URIs and absolute URLs are returned untouched; plain filenames get
// the base URL prefixed when one is configured.
// True when this reference can actually be fetched. Data URIs always work.
// Plain paths fail on file:// because browsers block XHR there, and a
// missing optional asset is marked "MISSING" by the build.
function assetLoadable(src) {
  if (typeof src !== "string" || !src || src === "MISSING") return false;
  if (src.startsWith("data:")) return true;
  return window.location.protocol !== "file:";
}

function assetUrl(src) {
  if (typeof src !== "string" || !src || src === "MISSING") return src;
  if (src.startsWith("data:") || /^https?:\/\//i.test(src) || src.startsWith("//")) return src;
  if (!ASSET_BASE_URL) return src;
  const base = ASSET_BASE_URL.endsWith("/") ? ASSET_BASE_URL : ASSET_BASE_URL + "/";
  return base + src.replace(/^\.?\//, "");
}

// --- Sound ------------------------------------------------------------------
// Deliberately plain HTML5 Audio rather than Phaser's sound manager or the
// WebAudio graph: decoding and mixing happen off the main thread, so this
// never touches the render loop or costs frame time. Every sound is
// optional, every call is wrapped, and any failure is swallowed -- audio can
// never break or slow the game.
const Snd = {
  ready: false,
  muted: false,
  music: null,       // currently playing music element
  musicKey: null,
  pools: {},         // key -> { els: [Audio], i: 0 }
  srcs: {},

  init() {
    if (this.ready) return;
    this.ready = true;
    if (!SOUND_ON) return;
    this.srcs = {
      menu: SND_MENU_SRC, game: SND_GAME_SRC, coin: SND_COIN_SRC,
      hit: SND_HIT_SRC, catch: SND_CATCH_SRC, tap: SND_TAP_SRC, shield: SND_SHIELD_SRC
    };
    // Short effects get a small pool so rapid repeats (coin pickups) can
    // overlap instead of cutting each other off.
    ["coin", "hit", "catch", "tap", "shield"].forEach(k => this.pool(k, k === "coin" ? 4 : 2));
  },

  usable(src) {
    return SOUND_ON && assetLoadable(src);
  },

  pool(key, size) {
    const src = this.srcs[key];
    if (!this.usable(src)) return;
    try {
      const els = [];
      for (let i = 0; i < size; i++) {
        const a = new Audio(assetUrl(src));
        a.preload = "auto";
        a.volume = SFX_VOLUME;
        els.push(a);
      }
      this.pools[key] = { els, i: 0 };
    } catch (e) { /* audio unavailable; game continues silently */ }
  },

  play(key) {
    if (this.muted || !this.pools[key]) return;
    try {
      const p = this.pools[key];
      const a = p.els[p.i];
      p.i = (p.i + 1) % p.els.length;
      a.currentTime = 0;
      const r = a.play();
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  },

  playMusic(key) {
    if (!SOUND_ON) return;
    const src = this.srcs[key];
    if (!this.usable(src)) return;
    if (this.musicKey === key && this.music && !this.music.paused) return;
    this.stopMusic();
    try {
      const a = new Audio(assetUrl(src));
      a.loop = true;
      a.volume = this.muted ? 0 : MUSIC_VOLUME;
      const r = a.play();
      // Browsers block autoplay until the first real interaction; retry
      // once on the next tap rather than giving up on music entirely.
      if (r && r.catch) r.catch(() => {
        const retry = () => {
          const rr = a.play();
          if (rr && rr.catch) rr.catch(() => {});
          window.removeEventListener("pointerdown", retry);
        };
        window.addEventListener("pointerdown", retry, { once: true });
      });
      this.music = a;
      this.musicKey = key;
    } catch (e) {}
  },

  stopMusic() {
    if (!this.music) return;
    try { this.music.pause(); this.music.currentTime = 0; } catch (e) {}
    this.music = null;
    this.musicKey = null;
  },

  duckMusic(on) {
    if (!this.music) return;
    try { this.music.volume = this.muted ? 0 : (on ? MUSIC_VOLUME * 0.25 : MUSIC_VOLUME); } catch (e) {}
  },

  setMuted(m) {
    this.muted = !!m;
    if (this.music) { try { this.music.volume = this.muted ? 0 : MUSIC_VOLUME; } catch (e) {} }
  }
};

// Converts Persian and Arabic-Indic digits to plain ASCII digits, so typing
// on a Persian keyboard (۰۹۱۲...) still works everywhere a number is
// expected. Mirrors the same conversion the server does.
function toAsciiDigits(s) {
  const persian = "۰۱۲۳۴۵۶۷۸۹", arabic = "٠١٢٣٤٥٦٧٨٩";
  return String(s).replace(/[۰-۹٠-٩]/g, (ch) => {
    let idx = persian.indexOf(ch);
    if (idx === -1) idx = arabic.indexOf(ch);
    return idx === -1 ? ch : String(idx);
  });
}

// A small, touch-friendly numeric-only input overlay — replaces
// window.prompt() for phone/OTP entry, which isn't restrictable to digits
// and is a poor touch experience on mobile. Returns a Promise resolving to
// the entered digits, or null if the player cancels.
function askNumericInput(message, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "numprompt-overlay";
    const box = document.createElement("div");
    box.className = "numprompt-box";
    const p = document.createElement("p");
    p.textContent = message;
    const input = document.createElement("input");
    input.type = "tel";
    input.inputMode = "numeric";
    input.pattern = "[0-9]*";
    input.maxLength = opts.maxLength || 20;
    input.autocomplete = "off";
    input.addEventListener("input", () => {
      input.value = toAsciiDigits(input.value).replace(/[^0-9]/g, "");
    });

    const buttons = document.createElement("div");
    buttons.className = "numprompt-buttons";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "numprompt-cancel";
    cancelBtn.textContent = opts.cancelText || "Cancel";
    const okBtn = document.createElement("button");
    okBtn.className = "numprompt-ok";
    okBtn.textContent = opts.okText || "OK";

    function done(value) {
      document.body.removeChild(overlay);
      resolve(value);
    }
    okBtn.addEventListener("click", () => done(input.value || null));
    cancelBtn.addEventListener("click", () => done(null));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); okBtn.click(); } });

    buttons.appendChild(cancelBtn);
    buttons.appendChild(okBtn);
    box.appendChild(p);
    box.appendChild(input);
    box.appendChild(buttons);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => input.focus(), 50);
  });
}

function fitTextWidth(textObj, baseSize, maxWidth, minSize) {
  minSize = minSize || 6;
  let size = baseSize;
  textObj.setFontSize(Math.round(size));
  let guard = 20;
  while (textObj.width > maxWidth && size > minSize && guard-- > 0) {
    size *= 0.92;
    textObj.setFontSize(Math.round(size));
  }
}

// --- Leaderboard API helpers -----------------------------------------------
//
// Identity model: a phone number only becomes a real, submittable identity
// after it proves ownership via a one-time SMS code (OTP). Successful
// verification gets a randomly-generated username and a long-lived
// "identity token" back from the server, stored in localStorage. Every
// score submission after that is tied to that identity token — never to a
// bare phone number typed into a request — so nobody can submit a score
// "as" a phone number they don't own.

function getStoredPhone() {
  try { return localStorage.getItem("playerPhone") || null; } catch (e) { return null; }
}

function setStoredPhone(phone) {
  try { localStorage.setItem("playerPhone", phone); } catch (e) {}
}

function isValidPhoneInput(phone) {
  return typeof phone === "string" && /^[0-9+\-\s]{4,20}$/.test(phone.trim());
}

function getIdentity() {
  try {
    const token = localStorage.getItem("playerIdentityToken");
    const username = localStorage.getItem("playerUsername");
    if (token && username) return { token, username };
  } catch (e) {}
  return null;
}

function setIdentity(token, username) {
  try {
    localStorage.setItem("playerIdentityToken", token);
    localStorage.setItem("playerUsername", username);
  } catch (e) {}
}

function clearIdentity() {
  try {
    localStorage.removeItem("playerIdentityToken");
    localStorage.removeItem("playerUsername");
  } catch (e) {}
}

// Fetches the top N players from the server. Returns null (never throws) on
// any failure — callers should keep whatever they were already showing.
async function fetchTopLeaderboard(limit) {
  if (!leaderboardLive()) return null;
  try {
    const res = await fetch(LEADERBOARD_API_URL + "?action=top&limit=" + (limit || 3));
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || data.ok !== true || !Array.isArray(data.top)) return null;
    return data.top.map(e => ({ username: String(e.username || ""), score: Number(e.score) || 0 }));
  } catch (e) {
    return null;
  }
}

// Pure-JS SHA-256, used only as a fallback when crypto.subtle isn't
// available (it's restricted to secure origins, so plain HTTP would
// otherwise be unable to sign a score at all). Produces byte arrays.
const SHA256_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function sha256Bytes(bytes) {
  const h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const len = bytes.length;
  const withOne = len + 1;
  const padded = new Uint8Array(Math.ceil((withOne + 8) / 64) * 64);
  padded.set(bytes);
  padded[len] = 0x80;
  const bits = len * 8;
  // Length is a 64-bit big-endian value; JS bitwise is 32-bit, so write the
  // high word with division rather than shifts.
  const hi = Math.floor(bits / 0x100000000);
  const lo = bits >>> 0;
  const dv = new DataView(padded.buffer);
  dv.setUint32(padded.length - 8, hi);
  dv.setUint32(padded.length - 4, lo);

  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
  }
  const out = new Uint8Array(32);
  const odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, h[i]);
  return out;
}

function hmacSha256Fallback(keyStr, msgStr) {
  const enc = new TextEncoder();
  let key = enc.encode(keyStr);
  if (key.length > 64) key = sha256Bytes(key);
  const pad = new Uint8Array(64);
  pad.set(key);
  const inner = new Uint8Array(64), outer = new Uint8Array(64);
  for (let i = 0; i < 64; i++) { inner[i] = pad[i] ^ 0x36; outer[i] = pad[i] ^ 0x5c; }
  const msg = enc.encode(msgStr);
  const innerMsg = new Uint8Array(64 + msg.length);
  innerMsg.set(inner); innerMsg.set(msg, 64);
  const innerHash = sha256Bytes(innerMsg);
  const outerMsg = new Uint8Array(64 + 32);
  outerMsg.set(outer); outerMsg.set(innerHash, 64);
  return Array.from(sha256Bytes(outerMsg)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// HMAC-SHA256. Uses the browser's native Web Crypto when it's available
// (secure origins), and falls back to the pure-JS implementation above on
// plain HTTP so score submission still works there. Ties a submission to
// one server-issued run token so a captured request can't be edited to
// claim a different score.
async function hmacHex(keyStr, msgStr) {
  if (window.crypto && window.crypto.subtle) {
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw", enc.encode(keyStr), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
      );
      const sigBuf = await crypto.subtle.sign("HMAC", key, enc.encode(msgStr));
      return Array.from(new Uint8Array(sigBuf)).map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { /* fall through to the JS implementation */ }
  }
  return hmacSha256Fallback(keyStr, msgStr);
}

// One-time run token for the run about to start. Call this right when a run
// begins — the server times every submission against when this was issued,
// so starting it late only ever hurts the player (a stricter window), never
// helps a cheater.
let currentScoreToken = null;

async function startScoreSession() {
  currentScoreToken = null;
  if (!leaderboardLive()) return;
  try {
    const res = await fetch(LEADERBOARD_API_URL + "?action=session");
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.ok && data.token) currentScoreToken = data.token;
  } catch (e) { /* leaderboard unreachable — run continues normally, just won't submit */ }
}

async function requestOtp(phone) {
  try {
    const res = await fetch(LEADERBOARD_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "request_otp", phone })
    });
    const data = await res.json();
    return !!(data && data.ok);
  } catch (e) {
    return false;
  }
}

async function verifyOtpCode(phone, code) {
  try {
    const res = await fetch(LEADERBOARD_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "verify_otp", phone, code })
    });
    return await res.json();
  } catch (e) {
    return null;
  }
}

// Walks the player through phone -> OTP -> verified identity, using plain
// browser prompts (no extra UI to build). onStatus(text) is called at each
// step so a caller (the game-over popup) can show progress. Returns
// { token, username } on success, or null if the player cancels/fails.
async function registerFlow(onStatus) {
  let phone = getStoredPhone();
  if (!phone) {
    const entered = await askNumericInput("Enter your phone number to save your score:", { maxLength: 20, okText: "Send code" });
    const normalized = entered ? toAsciiDigits(entered).trim() : "";
    if (!normalized || !isValidPhoneInput(normalized)) { onStatus("Score not saved"); return null; }
    phone = normalized;
  }

  onStatus("Sending verification code...");
  const sent = await requestOtp(phone);
  if (!sent) { onStatus("Could not send verification code"); return null; }

  const code = await askNumericInput("Enter the code sent to " + phone + ":", { maxLength: 6, okText: "Verify" });
  const normalizedCode = code ? toAsciiDigits(code).trim() : "";
  if (!normalizedCode) { onStatus("Score not saved"); return null; }

  onStatus("Verifying...");
  const res = await verifyOtpCode(phone, normalizedCode);
  if (!res || !res.ok || !res.identity_token || !res.username) {
    onStatus(res && res.error === "invalid code" ? "Wrong code" : "Verification failed");
    return null;
  }

  setStoredPhone(phone);
  setIdentity(res.identity_token, res.username);
  onStatus("Welcome, " + res.username + "!");
  return { token: res.identity_token, username: res.username };
}

async function postSubmit(identityToken, score, runToken) {
  try {
    const sig = await hmacHex(SCORE_SIGN_KEY, runToken + ":" + score);
    if (!sig) return null;
    const res = await fetch(LEADERBOARD_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "submit", identity_token: identityToken, score, token: runToken, sig })
    });
    return await res.json();
  } catch (e) {
    return null;
  }
}

// Orchestrates the whole post-run flow: register (if needed) then submit.
// onStatus(text) is called throughout so a popup can show live progress.
// Only ever called once per run, right after a run ends.
async function saveScoreAfterRun(score, onStatus) {
  // Practice runs are for learning, not the leaderboard.
  if (practiceMode) { onStatus("Practice run - not scored"); return null; }
  if (!leaderboardLive() || !currentScoreToken) { onStatus(""); return null; }
  const runToken = currentScoreToken;
  currentScoreToken = null; // one-shot client-side too, never resend the same token

  let identity = getIdentity();
  if (!identity) {
    identity = await registerFlow(onStatus);
    if (!identity) return null;
  }

  onStatus("Saving score...");
  let result = await postSubmit(identity.token, score, runToken);

  // Identity token no longer valid server-side (e.g. database was reset) —
  // re-register once, then retry the submission a single time.
  if (result && result.ok === false && result.error === "not_registered") {
    clearIdentity();
    onStatus("Please verify your phone again");
    identity = await registerFlow(onStatus);
    if (!identity) return null;
    result = await postSubmit(identity.token, score, runToken);
  }

  if (result && result.ok) {
    onStatus(identity.username + " — Rank #" + result.rank);
  } else {
    onStatus("Score not saved");
  }
  return result;
}

function paintButton(g, w, h, top, bot, line) {
  const r = h * BTN_RADIUS;
  g.clear();
  g.fillStyle(0x02070c, 0.35);
  g.fillRoundedRect(-w / 2, -h / 2 + h * 0.07, w, h, r);
  g.fillGradientStyle(top, top, bot, bot, 1);
  g.fillRoundedRect(-w / 2, -h / 2, w, h, r);
  g.fillStyle(0xffffff, 0.13);
  g.fillRoundedRect(-w / 2 + w * 0.06, -h / 2 + h * 0.12, w - w * 0.12, h * 0.32, r * 0.6);
  g.lineStyle(Math.max(2, h * 0.045), line, 0.95);
  g.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
}

class LoadScene extends Phaser.Scene {
  constructor() {
    super("Load");
  }

  preload() {
    this.kind = "load";
    live = this;

    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor("#06121c");

    this.loadLabel = this.add.text(W * 0.5, H * LOAD_LABEL_Y, LOADING_TEXT, {
      fontFamily: PLATE_FONT, color: SCORE_TOP
    }).setOrigin(0.5).setDepth(1).setResolution(2);

    this.barBg = this.add.rectangle(W * 0.5, H * LOAD_BAR_Y, W * LOAD_BAR_W, H * LOAD_BAR_H, 0x0a1e2c)
      .setOrigin(0.5).setStrokeStyle(2, LINE_COLOR, 0.5).setDepth(1);
    this.barFill = this.add.rectangle(W * 0.5 - W * LOAD_BAR_W * 0.5, H * LOAD_BAR_Y, 2, H * LOAD_BAR_H, LINE_GEM)
      .setOrigin(0, 0.5).setDepth(1);

    this.load.on("progress", p => {
      this.barFill.width = Math.max(2, W * LOAD_BAR_W * p);
    });

    // Any load failure here must not cascade: a missing texture would make
    // Phaser dereference a null frame later ("cannot read sourceSize").
    this.load.on("loaderror", (file) => {
      if (file && file.key) this.badLoads = (this.badLoads || {}), this.badLoads[file.key] = true;
    });

    // Loaded directly, standalone, so it can appear immediately — it must
    // never be routed through the (potentially large) atlas file, or it
    // would be just as slow to appear as everything else it's meant to
    // cover for. Skipped entirely on file:// unless it's a data URI,
    // because browsers block XHR for plain paths on that protocol.
    this.loadingImg = null;
    if (assetLoadable(LOADING_SRC)) {
      this.load.image("loadingimg", assetUrl(LOADING_SRC));
      this.load.once("filecomplete-image-loadingimg", () => {
        if (!this.textures.exists("loadingimg")) return;
        // Full-screen background for the loading page, cover-fitted.
        this.loadingImg = this.add.image(W * 0.5, H * 0.5, "loadingimg").setDepth(-1);
        this.fit();
      });
    }

    const atlasSrcs = window.ATLAS_ACTIVE_SRCS || ATLAS_SRCS;
    atlasSrcs.forEach((src, i) => {
      if (assetLoadable(src)) this.load.image("gameAtlas" + i, assetUrl(src));
    });
    if (INTRO_ON && assetLoadable(INTRO_SRC)) this.load.video("introVideo", assetUrl(INTRO_SRC));
    if (INTRO2_ON && assetLoadable(INTRO2_SRC)) this.load.video("introVideo2", assetUrl(INTRO2_SRC));
    if (MENU_BG_ON && assetLoadable(MENU_BG_SRC)) this.load.video("menuVideo", assetUrl(MENU_BG_SRC));
  }

  create() {
    rebuildAtlasSheets(this);
    rebuildAtlasImages(this);
    resettle();
    this.fit();
    this.scene.start("Menu");
  }

  fit() {
    const W = this.scale.width, H = this.scale.height;
    if (this.loadLabel) {
      this.loadLabel.setFontSize(Math.round(H * LOAD_LABEL_SIZE)).setPosition(W * 0.5, H * LOAD_LABEL_Y);
    }
    if (this.barBg) this.barBg.setSize(W * LOAD_BAR_W, H * LOAD_BAR_H).setPosition(W * 0.5, H * LOAD_BAR_Y);
    if (this.barFill) this.barFill.setPosition(W * 0.5 - W * LOAD_BAR_W * 0.5, H * LOAD_BAR_Y);
    if (this.loadingImg && this.loadingImg.width) {
      // Cover the whole screen without distorting: scale to the larger of
      // the two ratios and centre, cropping the overflow.
      const sc = Math.max(W / this.loadingImg.width, H / this.loadingImg.height);
      this.loadingImg.setScale(sc).setPosition(W * 0.5, H * 0.5);
    }
  }
}

    }
    this.introStarted = false;
    this.introSkippable = false;
    this.introDone = false;
    this.introVideo = null;

    // First-time suggestion: offered when the player taps Play with fewer
    // than TUTORIAL_RUNS runs behind them.
    this.suggestShown = false;

    this.suggestTitle = this.add.text(0, 0, "FIRST TIME?", { fontFamily: Ancient_FONT, fontSize: "28px", color: "#ffe9a8" })
      .setOrigin(0.5).setDepth(13).setVisible(false).setResolution(2);
    this.suggestBody = this.add.text(0, 0,
      "We suggest trying practice first. It teaches each obstacle one at a time and your score isn't submitted.",
      { fontFamily: UI_FONT, fontSize: "15px", color: "#eafcff", align: "center" })
      .setOrigin(0.5).setDepth(13).setVisible(false).setResolution(2);
    this.suggestYes = this.add.graphics().setDepth(13).setVisible(false);
    this.suggestYesTxt = this.add.text(0, 0, "PRACTICE", { fontFamily: Ancient_FONT, fontSize: "17px", color: "#2a1a06" })
      .setOrigin(0.5).setDepth(14).setVisible(false).setResolution(2);
    this.suggestNo = this.add.graphics().setDepth(13).setVisible(false);
    this.suggestNoTxt = this.add.text(0, 0, "JUST PLAY", { fontFamily: Ancient_FONT, fontSize: "17px", color: "#eafcff" })
      .setOrigin(0.5).setDepth(14).setVisible(false).setResolution(2);
    this.suggestYesRect = { x: 0, y: 0, w: 0, h: 0 };
    this.suggestNoRect = { x: 0, y: 0, w: 0, h: 0 };

    this.buildTop3();

    this.fit();
    this.input.on("pointerdown", () => poke());
    this.ready = true;
    Snd.init();
    Snd.playMusic("menu");
  }

  gild(t, top, bot) {
    const h = t.height;
    if (!h) return;
    const grd = t.context.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, top);
    grd.addColorStop(0.5, top);
    grd.addColorStop(1, bot);
    t.setFill(grd);
  }

  suggestGroup() {
    return [this.suggestPanel, this.suggestTitle, this.suggestBody,
            this.suggestYes, this.suggestYesTxt, this.suggestNo, this.suggestNoTxt].filter(Boolean);
  }

  layoutSuggest() {
    const W = this.scale.width, H = this.scale.height;
    const pw = Math.min(W * 0.78, H * 1.3), ph = H * 0.5;
    const px = W * 0.5, py = H * 0.5;
    const r = Math.min(pw, ph) * 0.08;

    this.suggestPanel.clear();
    this.suggestPanel.fillStyle(0x000000, 0.62);
    this.suggestPanel.fillRect(0, 0, W, H);
    this.suggestPanel.fillStyle(0x081722, 0.97);
    this.suggestPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);
    this.suggestPanel.fillGradientStyle(0xffffff, 0xffffff, 0x9fc4dc, 0x9fc4dc, 0.07, 0.07, 0, 0);
    this.suggestPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph * 0.28, { tl: r, tr: r, bl: 0, br: 0 });
    this.suggestPanel.lineStyle(Math.max(1, Math.round(H * 0.0024)), 0xffe9a8, 0.75);
    this.suggestPanel.strokeRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);

    this.suggestTitle.setPosition(px, py - ph * 0.31);
    fitTextWidth(this.suggestTitle, ph * 0.13, pw * 0.85, 14);
    this.gild(this.suggestTitle, "#ffe9a8", "#c99a3f");

    this.suggestBody.setWordWrapWidth(pw * 0.82);
    this.suggestBody.setPosition(px, py - ph * 0.03);
    fitTextWidth(this.suggestBody, ph * 0.062, pw * 0.82, 10);

    const minTouch = Math.max(44 * (window.devicePixelRatio || 1), H * 0.075);
    const bw = pw * 0.4, bh = Math.max(ph * 0.15, minTouch);
    const by = py + ph * 0.31;

    const yx = px - pw * 0.22;
    paintButton(this.suggestYes.setPosition(yx, by), bw, bh, BTN_GOLD_TOP, BTN_GOLD_BOT, BTN_GOLD_LINE);
    this.suggestYesTxt.setPosition(yx, by);
    fitTextWidth(this.suggestYesTxt, bh * 0.34, bw * 0.85, 10);
    this.suggestYesRect = { x: yx - bw / 2, y: by - bh / 2, w: bw, h: bh };

    const nx = px + pw * 0.22;
    paintButton(this.suggestNo.setPosition(nx, by), bw, bh, BTN_TEAL_TOP, BTN_TEAL_BOT, BTN_TEAL_LINE);
    this.suggestNoTxt.setPosition(nx, by);
    fitTextWidth(this.suggestNoTxt, bh * 0.34, bw * 0.85, 10);
    this.suggestNoRect = { x: nx - bw / 2, y: by - bh / 2, w: bw, h: bh };
  }

  showSuggest() {
    this.suggestShown = true;
    const g = this.suggestGroup();
    g.forEach(o => o.setVisible(true).setAlpha(0));
    this.layoutSuggest();
    this.tweens.add({ targets: g, alpha: 1, duration: 200, ease: "Quad.easeOut" });
  }

  hideSuggest() {
    this.suggestShown = false;
    this.suggestGroup().forEach(o => o.setVisible(false));
  }

  hitSuggest(x, y) {
    const a = this.suggestYesRect, b = this.suggestNoRect;
    if (a && x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) {
      this.hideSuggest();
      practiceMode = true;
      this.startIntro();
      return true;
    }
    if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      this.hideSuggest();
      practiceMode = false;
      this.startIntro();
      return true;
    }
    return true;  // swallow taps elsewhere while it's up
  }

  buildBoardGlow() {
    // A filled rectangle behind the icon made the whole box pulse, including
    // the PNG's transparent corners. Instead the icons themselves "breathe"
    // (a gentle scale pulse), which respects transparency completely and
    // reads as alive without any visible box.
    // Only the leaderboard icon pulses; the practice icon stays still so
    // the two don't compete for attention.
    this.sideIcons = [this.boardImg].filter(Boolean);
    this.sideIcons.forEach((img, i) => {
      img.setInteractive({ useHandCursor: true });
      // Slight phase offset so the two don't pulse in lockstep.
      img.__pulse = this.tweens.add({
        targets: img,
        scaleX: { from: 1, to: SIDE_ICON_PULSE },
        scaleY: { from: 1, to: SIDE_ICON_PULSE },
        duration: 1050,
        delay: i * 260,
        yoyo: true,
        repeat: -1,
        ease: "Sine.easeInOut"
      });
      // Touch devices have no real hover, so pointerover (fired on the first
      // touch of a tap) and pointerdown together cover mouse and touch.
      const poke = () => {
        if (img.__pulse) img.__pulse.pause();
        this.tweens.add({
          targets: img,
          scaleX: SIDE_ICON_POKE, scaleY: SIDE_ICON_POKE,
          duration: 110, yoyo: true, ease: "Back.easeOut",
          onComplete: () => { if (img.__pulse) img.__pulse.resume(); }
        });
      };
      img.on("pointerover", poke);
      img.on("pointerdown", poke);
    });

    // The practice icon sits still, but still gives press feedback so it
    // doesn't feel dead compared to its neighbour.
    if (this.practiceImg) {
      this.practiceImg.setInteractive({ useHandCursor: true });
      const tap = () => this.tweens.add({
        targets: this.practiceImg,
        scaleX: SIDE_ICON_POKE, scaleY: SIDE_ICON_POKE,
        duration: 110, yoyo: true, ease: "Back.easeOut"
      });
      this.practiceImg.on("pointerover", tap);
      this.practiceImg.on("pointerdown", tap);
    }
  }

  // Kept as a no-op hook so existing fit() calls stay valid; the pulse is
  // driven entirely by tweens now, with nothing to lay out.
  layoutBoardGlow() {}

  buildTop3() {
    this.top3Shadow = this.add.graphics().setDepth(0);
    this.top3Panel = this.add.graphics().setDepth(1);

    this.top3Title = this.add.text(0, 0, "\u{1F451} TOP PLAYERS \u{1F451}", {
      fontFamily: Ancient_FONT, fontSize: "20px", color: SCORE_TOP, letterSpacing: 1,
      stroke: "#3a2405", strokeThickness: 2
    }).setOrigin(0.5, 0).setDepth(2).setResolution(2);
    this.gild(this.top3Title, "#fff3d0", "#c99a3f");
    this.top3Title.setShadow(0, 2, "#04101b", 6, false, true);

    const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];
    this.top3Lines = [];
    this.top3Rows = TOP3_SAMPLE.map((row, i) => {
      const phone = this.add.text(0, 0, medals[i] + " " + row.phone, {
        fontFamily: Ancient_FONT, fontSize: "18px", color: SCORE_TOP
      }).setOrigin(0, 0.5).setDepth(2).setResolution(2);
      this.gild(phone, SCORE_TOP, SCORE_BOT);
      phone.setShadow(0, 1, "#04101b", 3, false, true);

      const score = this.add.text(0, 0, comma(row.score), {
        fontFamily: Ancient_FONT, fontSize: "24px", color: BEST_TOP,
        stroke: "#3a2405", strokeThickness: 3
      }).setOrigin(1, 0.5).setDepth(2).setResolution(2);
      this.gild(score, "#ffe9a8", "#c99a3f");
      score.setShadow(0, 2, "#04101b", 5, false, true);

      if (i < TOP3_SAMPLE.length - 1) {
        const line = this.add.graphics().setDepth(1);
        this.top3Lines.push(line);
      }
      return { phone, score };
    });

    // Prompt at the bottom of the panel offering the full board.
    this.top3Full = this.add.text(0, 0, "SEE FULL LEADERBOARD", {
      fontFamily: Ancient_FONT, fontSize: "14px", color: "#cfe6f2"
    }).setOrigin(0.5).setDepth(2).setResolution(2);
    this.top3FullRect = { x: 0, y: 0, w: 0, h: 0 };

    // Hidden until the player taps the leaderboard icon. Nothing about the
    // board should be on screen when the menu first opens.
    this.top3Open = false;
    this.top3Group().forEach(o => o.setVisible(false).setAlpha(0));
  }

  top3Group() {
    return [this.top3Shadow, this.top3Panel, this.top3Title, this.top3Full]
      .concat(this.top3Lines || [])
      .concat((this.top3Rows || []).flatMap(r => [r.phone, r.score]))
      .filter(Boolean);
  }

  openTop3() {
    if (this.top3Open) return;
    this.top3Open = true;
    this.layoutTop3();
    const group = this.top3Group();
    group.forEach(o => o.setVisible(true).setAlpha(0));
    this.tweens.add({ targets: group, alpha: 1, duration: 200, ease: "Quad.easeOut" });
    this.refreshTop3Live();
  }

  closeTop3() {
    if (!this.top3Open) return;
    this.top3Open = false;
    const group = this.top3Group();
    this.tweens.add({
      targets: group, alpha: 0, duration: 180, ease: "Quad.easeIn",
      onComplete: () => group.forEach(o => o.setVisible(false))
    });
  }

  async refreshTop3Live() {
    const top = await fetchTopLeaderboard(3);
    // Scene may have moved on (player tapped Play), or the panel may have
    // been closed, by the time the network call resolves - bail out quietly.
    if (!top || !top.length || !this.top3Rows || !this.top3Open || !this.scene.isActive()) return;
    const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];
    top.forEach((entry, i) => {
      if (!this.top3Rows[i]) return;
      this.top3Rows[i].phone.setText(medals[i] + " " + entry.username);
      this.top3Rows[i].score.setText(comma(entry.score));
    });
    this.layoutTop3();
  }

  drawTop3Line(g, x1, x2, y) {
    const midX = (x1 + x2) / 2;
    g.clear();
    const steps = 10;
    for (let s = 0; s < steps; s++) {
      const t0 = s / steps, t1 = (s + 1) / steps;
      const a = 0.5 * Math.sin(Math.PI * ((t0 + t1) / 2));
      g.lineStyle(1, 0xffe9a8, Math.max(0, a));
      g.beginPath();
      g.moveTo(x1 + (x2 - x1) * t0, y);
      g.lineTo(x1 + (x2 - x1) * t1, y);
      g.strokePath();
    }
    const d = 3;
    g.fillStyle(0xffe9a8, 0.8);
    g.beginPath();
    g.moveTo(midX, y - d);
    g.lineTo(midX + d, y);
    g.lineTo(midX, y + d);
    g.lineTo(midX - d, y);
    g.closePath();
    g.fillPath();
  }

  layoutTop3() {
    const W = this.scale.width, H = this.scale.height;
    const pw = Math.round(W * TOP3_MAX_W);
    const pad = Math.round(W * TOP3_PAD);
    const rowH = Math.round(H * TOP3_ROW_H);
    const titleH = Math.round(rowH * 0.62);
    const px = Math.round(W - W * TOP3_RIGHT_MARGIN - pw);
    const py = Math.round(H * TOP3_TOP_MARGIN);
    const promptH = Math.round(rowH * 0.8);
    const ph = pad * 2 + titleH + rowH * TOP3_SAMPLE.length + promptH;
    const r = Math.round(rowH * 0.22);

    // Low-opacity glass panel behind everything
    this.top3Shadow.clear();
    this.top3Shadow.fillStyle(0x000000, 0.22);
    this.top3Shadow.fillRoundedRect(px, py + Math.round(H * 0.006), pw, ph, r);

    this.top3Panel.clear();
    this.top3Panel.fillGradientStyle(0xffffff, 0xffffff, 0xc9d8e6, 0xc9d8e6, 0.10, 0.10, 0.04, 0.04);
    this.top3Panel.fillRoundedRect(px, py, pw, ph, r);
    this.top3Panel.fillStyle(0xffffff, 0.08);
    this.top3Panel.fillRoundedRect(px, py, pw, Math.round(ph * 0.3), { tl: r, tr: r, bl: 0, br: 0 });
    this.top3Panel.lineStyle(1, 0xffffff, 0.35);
    this.top3Panel.strokeRoundedRect(px + 1, py + 1, pw - 2, ph - 2, r);
    this.top3Panel.lineStyle(1, 0x0a1c2a, 0.18);
    this.top3Panel.strokeRoundedRect(px, py, pw, ph, r);

    const smallScreenBoost = W < 500 ? 1.15 : 1;
    fitTextWidth(this.top3Title, titleH * 0.66 * smallScreenBoost, pw - pad * 2, 12);
    this.top3Title.setPosition(px + pw * 0.5, py + pad * 0.6);

    const innerX = px + pad, innerR = px + pw - pad;
    let cy = py + pad + titleH;
    this.top3Rows.forEach((row, i) => {
      const rowCy = cy + rowH * 0.5;

      fitTextWidth(row.score, rowH * 0.44 * smallScreenBoost, (innerR - innerX) * 0.42, 11);
      row.score.setPosition(innerR, rowCy);
      this.gild(row.score, "#ffe9a8", "#c99a3f");

      const phoneMaxW = Math.max(20, (innerR - row.score.width - Math.round(rowH * 0.18)) - innerX);
      fitTextWidth(row.phone, rowH * 0.34 * smallScreenBoost, phoneMaxW, 10);
      row.phone.setPosition(innerX, rowCy);
      this.gild(row.phone, SCORE_TOP, SCORE_BOT);

      cy += rowH;
      if (i < this.top3Lines.length) {
        this.drawTop3Line(this.top3Lines[i], innerX, innerR, cy);
      }
    });

    // "See full leaderboard" prompt across the bottom of the panel.
    if (this.top3Full) {
      const promptY = py + ph - pad - promptH * 0.4;
      this.top3Panel.fillStyle(0xffffff, 0.05);
      this.top3Panel.fillRoundedRect(px + pad * 0.5, promptY - promptH * 0.42, pw - pad, promptH * 0.84, promptH * 0.3);
      fitTextWidth(this.top3Full, promptH * 0.42 * smallScreenBoost, pw - pad * 2, 9);
      this.top3Full.setPosition(px + pw * 0.5, promptY);
      this.top3FullRect = {
        x: px + pad * 0.5, y: promptY - promptH * 0.42,
        w: pw - pad, h: promptH * 0.84
      };
    }
  }



  fitVideo(vid) {
    if (!vid) return;
    const W = this.scale.width;
    const H = this.scale.height;

    // Read the true video dimensions instead of canvas dimensions
    const vw = vid.width || vid.videoWidth || W;
    const vh = vid.height || vid.videoHeight || H;

    // Math.max scales the video to fill the screen without stretching (cover mode)
    const scale = Math.max(W / vw, H / vh);

    vid.setScale(scale).setPosition(W * 0.5, H * 0.5);
  }

  fit() {
    const W = this.scale.width, H = this.scale.height;
    this.unit = H / REF_H;

    this.fitVideo(this.menuVid);
    if (this.veil) this.veil.setSize(W, H);
    if (this.userTxt && this.userTxt.visible) {
      const f = Math.max(11, Math.round(H * 0.032));
      this.userTxt.setFontSize(f).setPosition(Math.round(W * 0.035), Math.round(H * 0.035));
      this.gild(this.userTxt, "#fff3d0", "#c99a3f");
    }
    if (this.top3Rows && this.top3Open) this.layoutTop3();
    if (this.suggestShown) this.layoutSuggest();

    if (this.title) {
      this.title.setFontSize(Math.round(H * MENU_TITLE_SIZE)).setPosition(W * 0.5, H * MENU_TITLE_Y);
      this.gild(this.title, SCORE_TOP, SCORE_BOT);
    }

    const pw = Math.round(W * PLAY_BTN_W);
    if (this.playImg && this.playImg.width && this.textures.exists("playbtn")) {
      const raw0 = this.textures.get("playbtn").getSourceImage();
      const wScale = pw / raw0.width;
      const hScale = (H * PLAY_BTN_MAX_H) / raw0.height;
      const btnScale = Math.min(wScale, hScale);
      bakeImageTo(this, this.playImg, "playbtn", "playbtn_baked", raw0.width * btnScale, raw0.height * btnScale, "_playBaked");
      this.playImg.setPosition(Math.round(W * 0.5), Math.round(H * PLAY_BTN_Y));
      const b = this.playImg.getBounds();
      this.playRect = { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height) };
    } else {
      const bh = Math.round(H * MENU_BTN_H);
      paintButton(this.playImg, pw, bh, BTN_GOLD_TOP, BTN_GOLD_BOT, BTN_GOLD_LINE);
      this.playImg.setPosition(Math.round(W * 0.5), Math.round(H * PLAY_BTN_Y));
      this.playRect = { x: Math.round(W * 0.5 - pw / 2), y: Math.round(H * PLAY_BTN_Y - bh / 2), w: pw, h: bh };
    }

    // Two small side buttons flank the play button: practice on the left,
    // leaderboard on the right, both sized to match each other.
    // Sized against the play button so they stay proportionate to it, then
    // pinned so their CENTRES land on the quarter and three-quarter marks
    // of the screen width. Capped so a big icon can't run off either edge
    // or collide with the play button.
    const playH = this.playRect.h || H * 0.1;
    let sideBox = playH * SIDE_BTN_H;
    const quarterX = Math.round(W * 0.25);
    // Room available at the quarter mark: to the screen edge on one side,
    // to the play button on the other.
    const roomToEdge = quarterX * 2 * 0.92;
    const roomToPlay = (this.playRect.x - quarterX) * 2 * 0.92;
    const room = Math.min(roomToEdge, roomToPlay > 0 ? roomToPlay : roomToEdge);
    sideBox = Math.min(sideBox, Math.max(24, room));
    sideBox = Math.max(sideBox, 44 * (window.devicePixelRatio || 1));
    const sideY = Math.round(H * PLAY_BTN_Y);

    if (this.practiceImg && this.textures.exists("tutlogo")) {
      const rawP = this.textures.get("tutlogo").getSourceImage();
      const sc = Math.min(sideBox / rawP.width, sideBox / rawP.height);
      bakeImageTo(this, this.practiceImg, "tutlogo", "tutlogo_baked", rawP.width * sc, rawP.height * sc, "_practiceBaked");
      this.practiceImg.setPosition(quarterX, sideY);
      const b = this.practiceImg.getBounds();
      this.practiceRect = { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height) };
      if (this.practiceImg.input) this.practiceImg.setInteractive({ useHandCursor: true });
    }

    if (this.boardImg && this.textures.exists("boardbtn")) {
      const raw1 = this.textures.get("boardbtn").getSourceImage();
      const lScale = Math.min(sideBox / raw1.width, sideBox / raw1.height);
      bakeImageTo(this, this.boardImg, "boardbtn", "boardbtn_baked", raw1.width * lScale, raw1.height * lScale, "_boardBaked");
      this.boardImg.setPosition(Math.round(W * 0.75), sideY);
      const b = this.boardImg.getBounds();
      this.boardRect = { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height) };
      // Baking swaps the texture, so the input hit area has to be rebuilt
      // or the hover/tap pulse would fire off the old bounds.
      if (this.boardImg.input) this.boardImg.setInteractive({ useHandCursor: true });
    }

    if (this.introVideo) {
      this.fitVideo(this.introVideo);
    }
  }

  handleTap(p) {
    if (this.suggestShown) { if (p) this.hitSuggest(p.x, p.y); return; }
    if (this.introStarted) {
      if (this.introSkippable) this.finishIntro();
      return;
    }
    if (!p) return;
    const pr = this.playRect;
    if (pr && p.x >= pr.x && p.x <= pr.x + pr.w && p.y >= pr.y && p.y <= pr.y + pr.h) {
      this.closeTop3();
      // Newcomers get offered the tutorial once instead of being dropped
      // straight into a real run.
      if (runsPlayed() < TUTORIAL_RUNS && !suggestSeen()) {
        markSuggestSeen();
        this.showSuggest();
        return;
      }
      practiceMode = false;
      this.startIntro();
      return;
    }
    const tr = this.practiceRect;
    if (this.practiceImg && tr && tr.w && p.x >= tr.x && p.x <= tr.x + tr.w && p.y >= tr.y && p.y <= tr.y + tr.h) {
      this.closeTop3();
      practiceMode = true;
      this.startIntro();
      return;
    }
    const br = this.boardRect;
    if (br && p.x >= br.x && p.x <= br.x + br.w && p.y >= br.y && p.y <= br.y + br.h) {
      // Open the full web leaderboard when one is configured; otherwise
      // fall back to the built-in panel so the button always does something.
      if (LEADERBOARD_PAGE_URL) {
        try { window.open(LEADERBOARD_PAGE_URL, "_blank", "noopener"); } catch (e) {}
      } else if (this.top3Open) {
        this.closeTop3();
      } else {
        this.openTop3();
      }
      return;
    }
    // While the panel is open, tapping the "full leaderboard" strip goes to
    // the full board scene; tapping anywhere else just closes the panel.
    if (this.top3Open) {
      const f = this.top3FullRect;
      if (f && f.w && p.x >= f.x && p.x <= f.x + f.w && p.y >= f.y && p.y <= f.y + f.h) {
        this.closeTop3();
        this.scene.start("Leaderboard");
        return;
      }
      this.closeTop3();
    }
  }

  startIntro() {
    if (this.introStarted) return;
    this.introStarted = true;

    const useSecond = introPlaysSoFar > 0;
    const videoKey = useSecond ? "introVideo2" : "introVideo";
    const videoOn = useSecond ? INTRO2_ON : INTRO_ON;

    if (!videoOn || !this.cache.video || !this.cache.video.exists(videoKey)) {
      introPlaysSoFar++;
      this.finishIntro();
      return;
    }
    introPlaysSoFar++;

    if (this.menuVid) this.menuVid.setPaused(true);

    const W = this.scale.width, H = this.scale.height;
    // Intro clips carry their own audio, so they play unmuted and the menu
    // music is stopped for the duration.
    Snd.stopMusic();
    this.introVideo = this.add.video(W * 0.5, H * 0.5, videoKey).setDepth(-1.5).setMute(false);
    try { this.introVideo.setVolume(VIDEO_VOLUME); } catch (e) {}

    // Refit as soon as frames start rendering so zero-dimension bugs are avoided
    this.introVideo.once("play", () => this.fitVideo(this.introVideo));

    this.fitVideo(this.introVideo);
    this.introVideo.play(false);
    this.introVideo.once("complete", () => this.finishIntro());

    // Clear the menu straight away: waiting for INTRO_HOLD_DELAY left the
    // buttons sitting on top of the intro after the player had already
    // committed, which felt unresponsive.
    const targets = [this.title, this.playImg, this.boardImg, this.practiceImg, this.userTxt, this.veil].filter(Boolean);
    this.tweens.add({ targets, alpha: 0, duration: INTRO_FADE_MS });
    // The skip-on-tap grace period is separate and still applies, so the
    // tap that started the intro can't immediately skip it too.
    this.time.delayedCall(INTRO_HOLD_DELAY * 1000, () => {
      this.introSkippable = true;
    });
  }

  finishIntro() {
    if (this.introDone) return;
    this.introDone = true;
    this.scene.start("ArrowFlight");
  }
}

class LeaderboardScene extends Phaser.Scene {
  constructor() {
    super("Leaderboard");
  }

  create() {
    this.kind = "board";
    live = this;
    resettle();

    const W = this.scale.width, H = this.scale.height;
    this.bgRect = this.add.rectangle(0, 0, W, H, 0x06121c, 1).setOrigin(0, 0).setDepth(-2);
    // Soft vignette so the flat background has some depth behind the panel.
    this.bgGlow = this.add.graphics().setDepth(-1.5);

    this.title = this.add.text(0, 0, "\u{1F451} " + BOARD_TITLE + " \u{1F451}", {
      fontFamily: Ancient_FONT, color: "#ffe9a8", stroke: "#3a2405", strokeThickness: 3
    }).setOrigin(0.5).setDepth(2).setResolution(2);
    this.title.setShadow(0, 3, "#04101b", 8, false, true);
    this.gild(this.title, "#fff3d0", "#c99a3f");

    this.subtitle = this.add.text(0, 0, "", {
      fontFamily: PLATE_FONT, color: "#7fa6c0"
    }).setOrigin(0.5).setDepth(2).setResolution(2);

    // Each row is its own set of objects (panel + rank + name + score) so
    // they can be aligned in real columns instead of one padded string.
    this.panel = this.add.graphics().setDepth(0);
    this.rows = Array.from({ length: BOARD_ROW_COUNT }, () => ({
      rank: this.add.text(0, 0, "", { fontFamily: Ancient_FONT, color: "#9fc4dc" })
        .setOrigin(0.5, 0.5).setDepth(2).setResolution(2),
      name: this.add.text(0, 0, "", { fontFamily: Ancient_FONT, color: SCORE_TOP })
        .setOrigin(0, 0.5).setDepth(2).setResolution(2),
      score: this.add.text(0, 0, "", { fontFamily: Ancient_FONT, color: "#ffe9a8" })
        .setOrigin(1, 0.5).setDepth(2).setResolution(2)
    }));

    this.backImg = this.textures.exists("boardbtn")
      ? this.add.image(0, 0, "boardbtn").setDepth(3)
      : this.add.graphics().setDepth(2);
    this.backRect = { x: 0, y: 0, w: 0, h: 0 };
    this._backBaked = null;

    // Optional link out to a full web leaderboard, only built when a URL
    // is actually configured.
    this.fullBtn = null;
    this.fullTxt = null;
    this.fullRect = { x: 0, y: 0, w: 0, h: 0 };
    if (LEADERBOARD_PAGE_URL) {
      this.fullBtn = this.add.graphics().setDepth(2);
      this.fullTxt = this.add.text(0, 0, "VIEW FULL LEADERBOARD", {
        fontFamily: PLATE_FONT, color: "#cfe6f2"
      }).setOrigin(0.5).setDepth(3).setResolution(2);
    }

    this.entries = [];
    this.refresh();
    this.fit();
    this.refreshLive();
    this.input.on("pointerdown", () => poke());
    this.ready = true;
  }

  gild(t, top, bot) {
    const h = t.height;
    if (!h) return;
    const grd = t.context.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, top);
    grd.addColorStop(0.5, top);
    grd.addColorStop(1, bot);
    t.setFill(grd);
  }

  // Local scores first, so the board is never blank while the network call
  // is still in flight.
  refresh() {
    const list = loadBoard();
    this.entries = list.slice(0, BOARD_ROW_COUNT).map(r => ({ name: r.name, score: r.score }));
    this.subtitle.setText("YOUR BEST RUNS");
    this.paintRows();
  }

  // Then swap in the real global board once it arrives.
  async refreshLive() {
    const top = await fetchTopLeaderboard(BOARD_ROW_COUNT);
    if (!top || !top.length || !this.scene.isActive()) return;
    this.entries = top.map(e => ({ name: e.username, score: e.score }));
    this.subtitle.setText("TOP PLAYERS WORLDWIDE");
    this.paintRows();
    this.fit();
  }

  paintRows() {
    this.rows.forEach((r, i) => {
      const e = this.entries[i];
      const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];
      r.rank.setText(i < 3 ? medals[i] : String(i + 1));
      r.name.setText(e ? e.name : EMPTY_ROW);
      r.score.setText(e ? comma(e.score) : "");
      const dim = !e;
      r.name.setAlpha(dim ? 0.35 : 1);
      r.score.setAlpha(dim ? 0.35 : 1);
      r.rank.setAlpha(dim ? 0.3 : 1);
    });
  }

  fit() {
    const W = this.scale.width, H = this.scale.height;
    if (this.bgRect) this.bgRect.setSize(W, H);

    // Panel is width-capped so rows don't stretch absurdly wide on desktop.
    // Deliberately narrow: a tall slim column reads better than a wide
    // stretched table, especially on desktop.
    const pw = Math.min(W * 0.62, H * 0.68, 520 * (window.devicePixelRatio || 1));
    const px = W * 0.5 - pw / 2;

    const titleFont = Math.round(H * 0.062);
    const subFont = Math.round(H * 0.026);
    const topMargin = Math.round(H * 0.05);

    this.title.setFontSize(titleFont).setPosition(W * 0.5, topMargin);
    this.gild(this.title, "#fff3d0", "#c99a3f");
    this.subtitle.setFontSize(subFont).setPosition(W * 0.5, topMargin + titleFont * 0.85);

    const headerBottom = topMargin + titleFont * 0.85 + subFont * 1.6;
    const backH = Math.max(H * 0.075, 44 * (window.devicePixelRatio || 1));
    const backGap = backH * 1.5;
    // Rows share whatever vertical space is left between the header and the
    // back button, so the board always fits regardless of screen shape.
    const avail = H - headerBottom - backGap - H * 0.03;
    const rowH = Math.min(H * 0.062, avail / BOARD_ROW_COUNT);
    const rowsTop = headerBottom + rowH * 0.35;
    const ph = rowH * BOARD_ROW_COUNT + rowH * 0.5;
    const r = rowH * 0.4;

    // Glass panel behind the rows.
    this.panel.clear();
    this.bgGlow.clear();
    this.bgGlow.fillStyle(0x0d2a3d, 0.5);
    this.bgGlow.fillCircle(W * 0.5, H * 0.42, Math.max(W, H) * 0.45);

    this.panel.fillStyle(0x0a1a27, 0.82);
    this.panel.fillRoundedRect(px, rowsTop - rowH * 0.25, pw, ph, r);
    this.panel.fillGradientStyle(0xffffff, 0xffffff, 0x9fc4dc, 0x9fc4dc, 0.06, 0.06, 0.0, 0.0);
    this.panel.fillRoundedRect(px, rowsTop - rowH * 0.25, pw, ph * 0.25, { tl: r, tr: r, bl: 0, br: 0 });
    this.panel.lineStyle(Math.max(1, Math.round(H * 0.0016)), 0xffe9a8, 0.35);
    this.panel.strokeRoundedRect(px, rowsTop - rowH * 0.25, pw, ph, r);

    const pad = pw * 0.05;
    const rankX = px + pad + rowH * 0.5;
    const nameX = px + pad + rowH * 1.45;
    const scoreX = px + pw - pad;
    const nameFont = Math.round(rowH * 0.46);
    const scoreFont = Math.round(rowH * 0.5);
    const rankFont = Math.round(rowH * 0.44);

    this.rows.forEach((row, i) => {
      const cy = rowsTop + rowH * (i + 0.5);
      // Alternating row tint for readability down a long list.
      if (i % 2 === 1) {
        this.panel.fillStyle(0xffffff, 0.03);
        this.panel.fillRect(px + pw * 0.02, cy - rowH * 0.45, pw * 0.96, rowH * 0.9);
      }
      row.rank.setFontSize(rankFont).setPosition(rankX, cy);
      row.score.setFontSize(scoreFont).setPosition(scoreX, cy);
      // Names can be long; size them to the space actually left between the
      // name column and the score column before positioning.
      row.name.setFontSize(nameFont);
      fitTextWidth(row.name, nameFont, Math.max(20, scoreX - nameX - row.score.width - pw * 0.04), 9);
      row.name.setPosition(nameX, cy);
      this.gild(row.name, SCORE_TOP, SCORE_BOT);
      this.gild(row.score, "#ffe9a8", "#c99a3f");

  }}

  mini(key, img, sx, sy, sw, sh, ph) {
    ph = Math.max(1, Math.min(Math.round(ph), sh));
    const pw = Math.max(1, Math.round(sw * ph / sh));
    let cw = sw, ch = sh;
    let c = document.createElement("canvas");
    c.width = cw;
    c.height = ch;
    let cx = c.getContext("2d");
    cx.imageSmoothingEnabled = true;
    cx.imageSmoothingQuality = "high";
    cx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    while (cw > pw * 2 && ch > ph * 2) {
      const nw = Math.max(pw, cw >> 1), nh = Math.max(ph, ch >> 1);
      const d = document.createElement("canvas");
      d.width = nw;
      d.height = nh;
      const dx = d.getContext("2d");
      dx.imageSmoothingEnabled = true;
      dx.imageSmoothingQuality = "high";
      dx.drawImage(c, 0, 0, cw, ch, 0, 0, nw, nh);
      c = d;
      cw = nw;
      ch = nh;
    }
    const out = document.createElement("canvas");
    out.width = pw;
    out.height = ph;
    const ox = out.getContext("2d");
    ox.imageSmoothingEnabled = true;
    ox.imageSmoothingQuality = "high";
    ox.drawImage(c, 0, 0, cw, ch, 0, 0, pw, ph);
    putCanvasTexture(this, key, out);
    this.soften(key);
  }

  miniSheet(key, img, cols, rows, frameCount, ph) {
    const fw = Math.floor(img.width / cols), fh = Math.floor(img.height / rows);
    ph = Math.max(1, Math.round(ph));
    const pw = Math.max(1, Math.round(fw * ph / fh));

    const out = document.createElement("canvas");
    out.width = pw * cols;
    out.height = ph * rows;
    const ox = out.getContext("2d");
    ox.imageSmoothingEnabled = true;
    ox.imageSmoothingQuality = "high";

    // Progressive halving is only needed for big reductions; below 2x the
    // browser's own filtering is already good. Skipping it (and the two
    // scratch canvases it needed) is a large win at load time, where this
    // runs once per frame of every sheet.
    if (fw <= pw * 2 && fh <= ph * 2) {
      for (let i = 0; i < frameCount; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        ox.drawImage(img, col * fw, row * fh, fw, fh, col * pw, row * ph, pw, ph);
      }
    } else {
      // Two reusable scratch canvases, ping-ponged, instead of allocating a
      // new one per halving step per frame.
      const a = document.createElement("canvas");
      const b = document.createElement("canvas");
      const ax = a.getContext("2d"), bx = b.getContext("2d");
      ax.imageSmoothingEnabled = bx.imageSmoothingEnabled = true;
      ax.imageSmoothingQuality = bx.imageSmoothingQuality = "high";

      for (let i = 0; i < frameCount; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        let cw = fw, ch = fh;
        a.width = cw; a.height = ch;
        ax.clearRect(0, 0, cw, ch);
        ax.drawImage(img, col * fw, row * fh, fw, fh, 0, 0, cw, ch);
        let src = a, sctx = ax, dst = b, dctx = bx;
        while (cw > pw * 2 && ch > ph * 2) {
          const nw = Math.max(pw, cw >> 1), nh = Math.max(ph, ch >> 1);
          dst.width = nw; dst.height = nh;
          dctx.clearRect(0, 0, nw, nh);
          dctx.drawImage(src, 0, 0, cw, ch, 0, 0, nw, nh);
          cw = nw; ch = nh;
          const ts = src, tc = sctx;
          src = dst; sctx = dctx; dst = ts; dctx = tc;
        }
        ox.drawImage(src, 0, 0, cw, ch, col * pw, row * ph, pw, ph);
      }
    }

    if (this.textures.exists(key)) this.textures.remove(key);
    this.textures.addSpriteSheet(key, out, { frameWidth: pw, frameHeight: ph });
    this.soften(key);
    // Removing the texture destroyed its frames, so anything still holding
    // one would crash on the next render. Rebuild the animation that uses
    // this sheet, then re-point every live sprite.
    this.rebuildSheetAnim(key);
    this.repointSheetUsers(key);
    return pw;
  }

  // Every animation that is built from a rebakeable sheet, in one place.
  // miniSheet() calls this after replacing a texture so no animation is
  // ever left pointing at destroyed frames.
  rebuildSheetAnim(key) {
    const specs = {
      arrow:  { anim: "fly",   fps: ARROW_FPS,  repeat: -1, cols: ARROW_COLS,  rows: ARROW_ROWS,  frames: ARROW_FRAMES },
      spear:  { anim: "stab",  fps: SPEAR_FPS,  repeat: -1, cols: SPEAR_COLS,  rows: SPEAR_ROWS,  frames: SPEAR_FRAMES },
      eagle:  { anim: "swoop", fps: EAGLE_FPS,  repeat: 0,  cols: EAGLE_COLS,  rows: EAGLE_ROWS,  frames: EAGLE_FRAMES },
      coin:   { anim: "shine", fps: COIN_FPS,   repeat: -1, cols: COIN_COLS,   rows: COIN_ROWS,   frames: COIN_FRAMES },
      hand:   { anim: "grab",  fps: HAND_FPS,   repeat: 0,  cols: HAND_COLS,   rows: HAND_ROWS,   frames: HAND_FRAMES },
      shield: { anim: "guard", fps: SHIELD_FPS, repeat: -1, cols: SHIELD_COLS, rows: SHIELD_ROWS, frames: SHIELD_FRAMES }
    };
    const sp = specs[key];
    if (!sp || !this.textures.exists(key)) return;
    const last = Math.min(sp.frames, sp.cols * sp.rows) - 1;
    if (last < 0) return;
    makeAnim(this, {
      key: sp.anim, frameRate: sp.fps, repeat: sp.repeat,
      frames: this.anims.generateFrameNumbers(key, { start: 0, end: last })
    });
  }

  // Re-points sprites at a freshly rebuilt spritesheet texture. Without
  // this, objects that weren't explicitly restarted (coins mid-flight to
  // the HUD, the pause-screen icons) keep a destroyed frame reference.
  repointSheetUsers(key) {
    const animOf = { arrow: "fly", spear: "stab", eagle: "swoop", coin: "shine", hand: "grab", shield: "guard" }[key];
    const fix = (obj, replay) => {
      if (!obj || !obj.setTexture) return;
      try {
        obj.setTexture(key, 0);
        // A sprite mid-animation still holds a destroyed frame, so restart
        // it on the rebuilt one rather than just swapping the texture.
        if (replay && animOf && obj.play && this.anims.exists(animOf)) obj.play(animOf);
      } catch (e) {}
    };
    if (key === "coin") {
      (this.coins || []).forEach(c => fix(c.img, c.mode !== 2));
      fix(this.coinIcon, false);      // static icons, never animated
      fix(this.overCoinIcon, false);
    } else if (key === "arrow") {
      fix(this.arrow, true);
    } else if (key === "spear") {
      (this.spears || []).forEach(s => fix(s.img, true));
    } else if (key === "eagle") {
      fix(this.eagle, false);
    } else if (key === "hand") {
      fix(this.hand, false);
    } else if (key === "shield") {
      fix(this.pick, true);
      fix(this.badge, false);
    }
  }

  bakeTex() {
    if (this.textures.exists("puff0")) return;

    for (let k = 0; k < WAVE_KINDS; k++) {
      const w = 384, h = 128;
      const tex = this.textures.createCanvas("puff" + k, w, h);
      const c = tex.getContext();
      c.lineCap = "round";
      c.lineJoin = "round";
      c.strokeStyle = "#ffffff";

      const wav = Phaser.Math.FloatBetween(0.6, 1.8);
      const rip = Phaser.Math.FloatBetween(1.6, 4.2);
      const amp = Phaser.Math.FloatBetween(4, 17);
      const fine = Phaser.Math.FloatBetween(1, 6);
      const off = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const off2 = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const tip = Phaser.Math.FloatBetween(-14, 14);
      const core = Phaser.Math.FloatBetween(1.5, 3.6);
      const skew = Phaser.Math.FloatBetween(0.7, 1.8);
      const open = Phaser.Math.FloatBetween(0.25, 1.2);
      const hook = Phaser.Math.FloatBetween(5, 24);
      const yAt = u => h / 2
        + Math.sin(off + u * Math.PI * 2 * wav) * amp * (open + u)
        + Math.sin(off2 + u * Math.PI * 2 * rip) * fine * u
        + tip * (u - 0.5) * 2
        - hook * Math.pow(1 - u, 3);
      const fAt = u => Math.pow(Math.sin(Math.PI * Math.pow(u, 0.85)), skew);

      const step = 4;
      [[core * 5.2, 0.045], [core * 2.5, 0.1], [core, 0.32], [core * 0.38, 0.55]].forEach(pass => {
        for (let x = 0; x < w - step; x += step) {
          const u = x / w, nu = (x + step) / w;
          const f = fAt(u);
          if (f < 0.02) continue;
          c.globalAlpha = pass[1] * f * f;
          c.lineWidth = Math.max(pass[0] * f, 0.4);
          c.beginPath();
          c.moveTo(x, yAt(u));
          c.quadraticCurveTo(x + step * 0.5, yAt((u + nu) * 0.5), x + step, yAt(nu));
          c.stroke();
        }
      });

      tex.refresh();
    }

    const ds = 256, mid = ds * 0.5;
    const halo = this.textures.createCanvas("dome0", ds, ds);
    const hc = halo.getContext();
    const hg = hc.createRadialGradient(mid, mid, ds * 0.18, mid, mid, mid);
    hg.addColorStop(0, "rgba(255,255,255,0.10)");
    hg.addColorStop(0.78, "rgba(255,255,255,0.20)");
    hg.addColorStop(0.9, "rgba(255,255,255,0.95)");
    hg.addColorStop(0.96, "rgba(255,255,255,0.35)");
    hg.addColorStop(1, "rgba(255,255,255,0)");
    hc.fillStyle = hg;
    hc.fillRect(0, 0, ds, ds);
    halo.refresh();

    const cellTex = this.textures.createCanvas("dome1", ds, ds);
    const cc = cellTex.getContext();
    cc.lineCap = "round";
    cc.strokeStyle = "rgba(255,255,255,0.9)";
    cc.lineWidth = ds * 0.02;
    for (let i = 0; i < DOME_CELLS; i++) {
      const a = (Math.PI * 2 / DOME_CELLS) * i;
      cc.beginPath();
      cc.arc(mid, mid, ds * 0.42, a, a + 0.5);
      cc.stroke();
    }
    cc.fillStyle = "rgba(255,255,255,0.95)";
    for (let i = 0; i < DOME_CELLS; i++) {
      const a = (Math.PI * 2 / DOME_CELLS) * i + 0.9;
      cc.beginPath();
      cc.arc(mid + Math.cos(a) * ds * 0.36, mid + Math.sin(a) * ds * 0.36, ds * 0.014, 0, Math.PI * 2);
      cc.fill();
    }
    cellTex.refresh();

    for (let k = 0; k < WAVE_KINDS; k++) this.soften("puff" + k);
    this.soften("dome0", "dome1");
  }

  fit() {
    const W = this.scale.width, H = this.scale.height;
    this.unit = H / REF_H;

    const src = this.textures.get("sky").getSourceImage();
    const cover = Math.max(H / (src.height * (1 - GROUND)), W / src.width);
    this.tw = Math.round(src.width * cover);
    this.groundY = Math.min(src.height * cover * (1 - GROUND), H);

    (this.tiles || []).forEach(t => t.destroy());
    const need = Math.ceil(W / this.tw) + 1;
    this.tiles = Array.from({ length: need }, (skip, i) => {
      const t = this.add.image(i * this.tw, 0, "sky").setOrigin(0).setScale(cover).setDepth(-1);
      t.displayWidth = this.tw + 1;
      return t;
    });

    if (this.arrowRaw) {
      const apx = Math.max(8, Math.round(H * ARROW_H));
      if (apx !== this.arrowPx) {
        this.arrowPx = apx;
        this.miniSheet("arrow", this.arrowRaw, ARROW_COLS, ARROW_ROWS, ARROW_FRAMES, apx);
        if (this.anims.exists("fly")) this.anims.remove("fly");
        const lf = Math.min(ARROW_FRAMES, ARROW_COLS * ARROW_ROWS) - 1;
        makeAnim(this, { key: "fly", frameRate: ARROW_FPS, repeat: -1,
          frames: this.anims.generateFrameNumbers("arrow", { start: 0, end: lf }) });
        if (this.arrow) this.arrow.play("fly");
      }
    }
    this.arrow.setScale(1);
    if (this.spearRaw) {
      const rfw = Math.floor(this.spearRaw.width / SPEAR_COLS), rfh = Math.floor(this.spearRaw.height / SPEAR_ROWS);
      const spx = Math.max(8, Math.round(H * SPEAR_LONG / SPEAR_FILL * rfh / rfw));
      if (spx !== this.spearPx) {
        this.spearPx = spx;
        this.miniSheet("spear", this.spearRaw, SPEAR_COLS, SPEAR_ROWS, SPEAR_FRAMES, spx);
        if (this.anims.exists("stab")) this.anims.remove("stab");
        const ls = Math.min(SPEAR_FRAMES, SPEAR_COLS * SPEAR_ROWS) - 1;
        makeAnim(this, { key: "stab", frameRate: SPEAR_FPS, repeat: -1,
          frames: this.anims.generateFrameNumbers("spear", { start: 0, end: ls }) });
        (this.spears || []).forEach(s => s.img.play("stab"));
      }
    }
    (this.spears || []).forEach(s => s.img.setScale(1));

    if (this.tutorialIcon && this.textures.exists("tutoricon")) {
      const traw = this.textures.get("tutoricon").getSourceImage();
      const tw = Math.round(W * TUTORIAL_W);
      const tWScale = tw / traw.width;
      const tHScale = (H * TUTORIAL_MAX_H) / traw.height;
      const tScale = Math.min(tWScale, tHScale);
      bakeImageTo(this, this.tutorialIcon, "tutoricon", "tutoricon_baked", traw.width * tScale, traw.height * tScale, "_tutorialBaked");
      this.tutorialIcon.setPosition(Math.round(W * 0.5), Math.round(H * (1 - TUTORIAL_BOTTOM_MARGIN) - this.tutorialIcon.displayHeight * 0.5));
    }
    this.homeX = W * 0.28;
    this.arrow.x = this.homeX - (this.back || 0) * this.unit;

    this.air.forEach(p => {
      p.x = Phaser.Math.FloatBetween(0, W);
      p.y = Phaser.Math.FloatBetween(0, H);
      p.par = Phaser.Math.FloatBetween(0.15, 0.55);
      p.dim = Phaser.Math.FloatBetween(0.25, 1);
      p.lean = Phaser.Math.FloatBetween(-12, 12);
      p.ph = Phaser.Math.FloatBetween(0, Math.PI * 2);
      p.sway = Phaser.Math.FloatBetween(0.6, 2.2);
      const s = Phaser.Math.FloatBetween(0.35, 1.6) * this.unit;
      p.sx = s * Phaser.Math.FloatBetween(0.7, 2.2);
      p.sy = s;
      p.img
        .setTexture("puff" + Phaser.Math.Between(0, WAVE_KINDS - 1))
        .setFlipY(Math.random() < 0.5)
        .setScale(p.sx, p.sy);
      p.len = p.img.displayWidth;
    });

    const ph = Math.round(H * PLATE_H);
    const praw = this.plate ? this.plate.texture.getSourceImage() : null;
    const pw = praw ? Math.round(ph * (praw.width / praw.height)) : Math.round(H * 0.43);
    const px = Math.round(W * PLATE_X), py = Math.round(H * PLATE_Y);
    this.plateW = pw;
    if (this.plate) this.plate.setPosition(px, py).setDisplaySize(pw, ph);
    const sf = Math.max(9, Math.round(ph * SCORE_FONT));
    const bf = Math.max(8, Math.round(ph * BEST_FONT));
    this.hud.setPosition(Math.round(px + pw * PLATE_TEXT_MID), Math.round(py + ph * SCORE_ROW_Y)).setFontSize(sf).setLetterSpacing(sf * SCORE_TRACK);
    this.hiTxt.setPosition(Math.round(px + pw * PLATE_TEXT_MID), Math.round(py + ph * BEST_ROW_Y)).setFontSize(bf).setLetterSpacing(bf * BEST_TRACK);
    this.hud.setShadow(0, Math.max(1, Math.round(ph * 0.03)), "#04101b", ph * 0.07, false, true);
    this.hiTxt.setShadow(0, Math.max(1, Math.round(ph * 0.02)), "#04101b", ph * 0.05, false, true);
    this.fancyLine(px, py, pw, ph);
    this.squeeze(this.hud, pw * SCORE_MAX_W);
    this.gild(this.hud, SCORE_TOP, SCORE_BOT);
    this.hudFit = this.hud.scaleX;
    this.showBest();

    // Coin tally sits just under the score plate, centered on it.
    if (this.coinTxt) {
      const cf = Math.max(8, Math.round(ph * BEST_FONT * 1.05));
      const iconH = Math.round(ph * 0.78); // 1.5x again: clearly readable
      // Extra vertical margin so it clears the plate, and nudged left so
      // the icon isn't crowding the plate's right edge.
      const coinY = Math.round(py + ph * 1.32);
      this.coinTxt.setFontSize(cf).setLetterSpacing(cf * 0.04);
      this.coinTxt.setShadow(0, Math.max(1, Math.round(ph * 0.02)), "#04101b", ph * 0.05, false, true);
      this.coinTxtFit = 1;
      this.coinTxt.setScale(1);
      if (this.coinIcon && this.coinIcon.frame && this.coinIcon.frame.height) {
        this.coinIconFit = iconH / this.coinIcon.frame.height;
        this.coinIcon.setScale(this.coinIconFit);
      }
      const iconW = this.coinIcon ? this.coinIcon.displayWidth : 0;
      const gap = Math.round(ph * 0.16); // roomier gap between icon and count
      const totalW = iconW + gap + this.coinTxt.width;
      const startX = Math.round(px + pw * PLATE_TEXT_MID - totalW / 2 - pw * 0.06);
      if (this.coinIcon) this.coinIcon.setPosition(startX + iconW / 2, coinY);
      this.coinTxt.setPosition(startX + iconW + gap, coinY);
      this.gild(this.coinTxt, "#ffe9a8", "#c99a3f");
      this.coinHudScale();
    }
    this.grab.setFontSize(Math.round(H * 0.052));
    this.veil.setSize(W, H);
    if (this.pauseBtn) {
      const ps = Math.round(H * PAUSE_H / this.pauseBtn.frame.height * 1000) / 1000;
      this.pauseBtn.setScale(ps).setPosition(Math.round(W - H * PAUSE_MARGIN), Math.round(H * PAUSE_MARGIN));
    }

    const pw2 = W * PAUSE_POPUP_W, ph2 = H * PAUSE_POPUP_H;
    const gap = H * PAUSE_POPUP_GAP;
    const cy = H * 0.5 - ph2 * 0.5 - gap * 0.5;
    const my = H * 0.5 + ph2 * 0.5 + gap * 0.5;

    // Fit each button inside the popup box on BOTH axes. Scaling by width
    // alone (the old behaviour) let a tall source PNG blow far past the
    // intended height. Baking at the fitted size also avoids shipping a
    // huge texture scaled down on the GPU.
    if (this.resumeImg && this.textures.exists("resumebtn")) {
      const raw = this.textures.get("resumebtn").getSourceImage();
      const sc = Math.min(pw2 / raw.width, ph2 / raw.height);
      bakeImageTo(this, this.resumeImg, "resumebtn", "resumebtn_baked",
        raw.width * sc, raw.height * sc, "_resumeBaked");
      this.resumeImg.setPosition(W * 0.5, cy);
    } else if (this.resumeImg) {
      this.resumeImg.setPosition(W * 0.5, cy);
      paintButton(this.resumeImg, pw2, ph2, BTN_GOLD_TOP, BTN_GOLD_BOT, BTN_GOLD_LINE);
    }
    this.resumeRect = { x: W * 0.5 - pw2 / 2, y: cy - ph2 / 2, w: pw2, h: ph2 };

    if (this.menuImg && this.textures.exists("menubtn")) {
      const raw = this.textures.get("menubtn").getSourceImage();
      const sc = Math.min(pw2 / raw.width, ph2 / raw.height);
      bakeImageTo(this, this.menuImg, "menubtn", "pausemenubtn_baked",
        raw.width * sc, raw.height * sc, "_pauseMenuBaked");
      this.menuImg.setPosition(W * 0.5, my);
    } else if (this.menuImg) {
      this.menuImg.setPosition(W * 0.5, my);
      paintButton(this.menuImg, pw2, ph2, BTN_TEAL_TOP, BTN_TEAL_BOT, BTN_TEAL_LINE);
    }
    this.menuRect = { x: W * 0.5 - pw2 / 2, y: my - ph2 / 2, w: pw2, h: ph2 };

    this.layoutGameOver();
    if (this.tutShown) this.layoutTutorial();
    if (this.hintShown) this.layoutHint();
    if (this.contShown) this.layoutContinue();

    if (this.badge) {
      const ph = Math.max(8, Math.round(H * BADGE_H));
      if (ph !== this.badgePx && this.textures.exists("shieldsheet")) {
        this.badgePx = ph;
        const raw = this.textures.get("shieldsheet").getSourceImage();
        this.mini("shieldicon", raw, 0, 0, Math.floor(raw.width / SHIELD_COLS), Math.floor(raw.height / SHIELD_ROWS), ph * BADGE_SS);
        this.badge.setTexture("shieldicon");
