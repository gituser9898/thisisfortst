html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06121c;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#holder{position:fixed;left:50%;top:50%;transform-origin:50% 50%;transform:translate(-50%,-50%);will-change:transform}
#holder canvas{display:block;width:100%;height:100%}
.numprompt-overlay{position:fixed;inset:0;background:rgba(4,16,27,0.78);display:flex;align-items:center;justify-content:center;z-index:9999;touch-action:auto}
.numprompt-box{background:#0c1c2a;border:2px solid #ffe9a8;border-radius:16px;padding:22px;max-width:320px;width:85%;text-align:center;font-family:sans-serif;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.numprompt-box p{color:#eafcff;margin:0 0 14px;font-size:16px;line-height:1.4}
.numprompt-box input{width:100%;box-sizing:border-box;padding:14px;font-size:22px;text-align:center;border-radius:10px;border:1px solid #ffe9a8;background:#04101b;color:#fff3d0;letter-spacing:3px;font-family:sans-serif}
.numprompt-box input:focus{outline:2px solid #ffe9a8}
.numprompt-buttons{display:flex;gap:10px;margin-top:16px}
.numprompt-buttons button{flex:1;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:bold;cursor:pointer;touch-action:manipulation}
.numprompt-ok{background:linear-gradient(#f6e3a1,#b9862f);color:#2a1a06}
.numprompt-cancel{background:#123243;color:#eafcff}
