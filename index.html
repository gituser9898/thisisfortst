      }
      this.badge.setScale((this.badgePx || H * BADGE_H) / this.badge.frame.height);
    }

    if (this.pick) {
      const targetPx = Math.max(8, Math.round(H * SHIELD_H));
      if (targetPx !== this.pickPx && this.textures.exists("shieldsheet")) {
        this.pickPx = targetPx;
        const raw = this.textures.get("shieldsheet").getSourceImage();
        const tail = Math.min(SHIELD_FRAMES, SHIELD_COLS * SHIELD_ROWS) - 1;
        this.miniSheet("pickicon", raw, SHIELD_COLS, SHIELD_ROWS, tail + 1, targetPx * PICK_SS);
        if (!this.anims.exists("guardicon")) {
          makeAnim(this, {
            key: "guardicon",
            frameRate: SHIELD_FPS,
            repeat: -1,
            frames: this.anims.generateFrameNumbers("pickicon", { start: 0, end: tail })
          });
        }
        const wasPaused = this.pick.anims && this.pick.anims.isPaused;
        this.pick.setTexture("pickicon");
        this.pick.play("guardicon");
        if (wasPaused) this.pick.anims.pause();
      }
      this.pick.setScale((this.pickPx || H * SHIELD_H) / this.pick.frame.height);
    }

    if (this.eagle) {
      if (this.eagleRaw) {
        const epx = Math.max(8, Math.round(H * EAGLE_H));
        if (epx !== this.eaglePx) {
          this.eaglePx = epx;
          this.miniSheet("eagle", this.eagleRaw, EAGLE_COLS, EAGLE_ROWS, EAGLE_FRAMES, epx);
          if (this.anims.exists("swoop")) this.anims.remove("swoop");
          const ew = Math.min(EAGLE_FRAMES, EAGLE_COLS * EAGLE_ROWS) - 1;
          if (ew > 0) makeAnim(this, { key: "swoop", frameRate: EAGLE_FPS, repeat: 0,
            frames: this.anims.generateFrameNumbers("eagle", { start: 0, end: ew }) });
        }
      }
      this.eagle.setScale(1);
    }

    if (this.hand) {
      if (this.handRaw) {
        const hpx = Math.max(8, Math.round(H * HAND_H));
        if (hpx !== this.handPx) {
          this.handPx = hpx;
          this.miniSheet("hand", this.handRaw, HAND_COLS, HAND_ROWS, HAND_FRAMES, hpx);
          if (this.anims.exists("grab")) this.anims.remove("grab");
          const hr = Math.min(HAND_FRAMES, HAND_COLS * HAND_ROWS) - 1;
          if (hr > 0) makeAnim(this, { key: "grab", frameRate: HAND_FPS, repeat: 0,
            frames: this.anims.generateFrameNumbers("hand", { start: 0, end: hr }) });
        }
      }
      this.hand.setScale(1);
    }

    if (this.coins && this.coins.length) {
      if (this.coinRaw) {
        const cpx = Math.max(8, Math.round(H * COIN_H));
        if (cpx !== this.coinPx) {
          this.coinPx = cpx;
          this.miniSheet("coin", this.coinRaw, COIN_COLS, COIN_ROWS, COIN_FRAMES, cpx);
          if (this.anims.exists("shine")) this.anims.remove("shine");
          const cg = Math.min(COIN_FRAMES, COIN_COLS * COIN_ROWS) - 1;
          if (cg > 0) {
            makeAnim(this, { key: "shine", frameRate: COIN_FPS, repeat: -1,
              frames: this.anims.generateFrameNumbers("coin", { start: 0, end: cg }) });
          }
          this.coins.forEach(c => { if (c.mode !== 2) c.img.play("shine"); });
          // Static icons don't animate, but still need re-pointing at the
          // rebuilt texture so they pick up the new resolution.
          if (this.coinIcon) this.coinIcon.setTexture("coin", 0);
          if (this.overCoinIcon) this.overCoinIcon.setTexture("coin", 0);
        }
      }
      this.coinScale = 1;
      this.coinGap = H * COIN_H * COIN_GAP;
      this.coins.forEach(c => { if (c.mode !== 2) c.img.setScale(1); });
    }
  }

  reset() {
    this.dead = false;
    this.born = 0;
    this.stall = false;
    this.spin = 0;
    this.dist = 0;
    this.bst = 0;
    this.vy = 0;
    this.gust = 0;
    this.want = 0;
    this.gustT = 0;
    this.spd = BG_SPEED;
    this.brake = 1;
    this.intro = true;
    this.breakTaps = BREAK_TAPS;
    this.spearsEscaped = 0;
    this.coinCount = 0;
    this.coinPop = 0;
    this.sayCoins();
    this.tutSlow = 1;
    this.hideHint();
    this.hideContinuePopup();
    // Practice mode re-teaches every hint each run.
    if (practiceMode) this.tutSeen = {};
    // Scripted lesson state. Normal runs skip it entirely.
    this.scriptStep = 0;
    this.scriptAge = 0;
    this.scriptDone = !practiceMode;
    const first = PRACTICE_SCRIPT[0];
    this.scriptLeft = practiceMode ? (first.count || 1) : 0;
    this.scriptGap = practiceMode ? (first.gap || PRACTICE_STEP_GAP) : 0;
    bumpRunsPlayed();
    // "How to play" card on the first runs. Shown immediately and with the
    // run paused, so no distance accrues while it's being read; dismissing
    // it restarts the run cleanly from 0 m.
    if (TUTORIAL_ON && practiceMode && !this.tutShown) {
      this.showTutorialCard(TUTORIAL_INTRO_CARD);
    }
    startScoreSession();
    if (this.tutorialIcon) this.tutorialIcon.setVisible(true);
    this.t = 0;
    this.up = 0;
    this.back = 0;
    this.slam = false;
    this.landed = false;
    this.caught = false;
    this.mash = 0;
    this.beat = 0;
    this.safeT = 0;
    this.grab.setVisible(false);
    this.shieldT = 0;
    this.pickT = SHIELD_WAIT;
    this.pickOn = false;
    if (this.pick) this.pick.setVisible(false);
    this.hideDome();
    this.pin = null;
    this.slowT = 0;
    this.bits.length = 0;
    this.rings.length = 0;
    // Wipe every effect layer, otherwise whatever was drawn on the final
    // frame of the previous run (spear shockwaves, boost streaks, the tap
    // hint) stays painted on screen after a restart.
    [this.spinG, this.zipG, this.tapHintG, this.windG].forEach(g => { if (g) g.clear(); });
    this.tapDrawn = false;
    this.windDrawn = false;
    this.spin = 0;
    this.bst = 0;
    this.arrow.setAlpha(1);
    this.eagleT = EAGLE_WAIT;
    this.eagleOn = false;
    if (this.eagle) this.eagle.setVisible(false).setAlpha(1);
    this.handT = HAND_WAIT;
    this.handState = "idle";
    if (this.hand) this.hand.setVisible(false).setAlpha(1);
    this.coinT = 2;
    this.hudPop = 0;
    (this.coins || []).forEach(c => this.freeCoin(c));
    this.spearT = SPEAR_WAIT;
    (this.spears || []).forEach(s => {
      s.live = false;
      s.down = false;
      s.img.setVisible(false).setAlpha(1);
      s.img.play("stab");
    });
    this.arrow.x = this.homeX;
    this.arrow.y = this.scale.height * 0.4;
    this.arrow.rotation = FLAT;
    this.arrow.clearTint();
    this.scoreTxt = "";
    this.scoreT = 0;
    this.sayScore(0);
  }

  tap() {
    if (this.halt || this.dead) return;
    if (this.tapHintLeft > 0) this.tapHintLeft--;
    if (this.intro) this.intro = false;
    if (this.caught) {
      this.mash += 1;
      this.beat = 1;
      Snd.play("tap");
      this.blast(this.arrow.x, this.arrow.y, 9);
      this.ringAt(this.arrow.x, this.arrow.y);
      this.cameras.main.shake(90, HIT_SHAKE * 0.3);
      return;
    }
    if (this.stall || this.slam) return;
    Snd.play("tap");
    this.vy = FLAP;
    if (this.safeT > 0) return;
    this.up = Math.min(this.up + CLIMB_PER_TAP, 1);
  }

  blast(x, y, n) {
    for (let i = 0; i < (n || HIT_BITS); i++) {
      const a = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const sp = Phaser.Math.FloatBetween(120, 620);
      this.bits.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        hue: Math.random() < 0.5 ? 0xeafcff : 0x74e4ff
      });
    }
  }

  doBits(dt, roll) {
    for (let i = this.bits.length - 1; i >= 0; i--) {
      const b = this.bits[i];
      b.life -= dt * HIT_BIT_FADE;
      if (b.life <= 0) { this.bits.splice(i, 1); continue; }
      b.vy += GRAVITY * 0.6 * dt;
      b.x += (b.vx * this.unit - roll * 0.35) * dt;
      b.y += b.vy * this.unit * dt;
      this.zipG.fillStyle(b.hue, b.life * 0.9)
        .fillCircle(b.x, b.y, (1 + 2.6 * b.life) * this.unit);
    }
  }

  ringAt(x, y) {
    this.rings.push({ x, y, r: this.arrow.displayHeight * 0.2, life: 1 });
  }

  doRings(dt, roll) {
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const o = this.rings[i];
      o.life -= dt / BREAK_RING;
      if (o.life <= 0) { this.rings.splice(i, 1); continue; }
      o.r += (500 + 1400 * (1 - o.life)) * this.unit * dt;
      o.x -= roll * dt * 0.5;
      this.zipG.lineStyle((1 + 7 * o.life) * this.unit, 0xcaf7ff, o.life * 0.75)
        .strokeCircle(o.x, o.y, o.r);
      this.zipG.lineStyle((0.5 + 2 * o.life) * this.unit, 0xffffff, o.life * 0.5)
        .strokeCircle(o.x, o.y, o.r * 0.82);
    }
  }

  smash(s) {
    if (this.dead || this.caught) return;

    this.landed = false;
    this.slowT = HIT_SLOW_TIME;

    s.live = false;

    const rush = Math.hypot(s.vx, s.vy) || 1;
    const reach = s.img.displayWidth * SPEAR_FILL * 0.5 + this.arrow.displayHeight * SPEAR_BITE;
    s.x = this.arrow.x - s.vx / rush * reach;
    s.y = this.arrow.y - s.vy / rush * reach;
    s.img.setPosition(s.x, s.y);

    this.pin = {
      img: s.img,
      dx: s.x - this.arrow.x,
      dy: s.y - this.arrow.y,
      rot: s.img.rotation,
      base: this.arrow.rotation
    };

    this.spin = HIT_SPIN * Phaser.Math.FloatBetween(0.7, 1.3) * (Math.random() < 0.5 ? 1 : -1);
    this.vy = HIT_KICK;
    this.blast(this.arrow.x, this.arrow.y);

    this.cameras.main.shake(240, HIT_SHAKE);
    this.cameras.main.flash(140, 210, 245, 255);

    this.ringAt(this.arrow.x, this.arrow.y);
    this.arrow.setTint(0xff8080);

    if (BREAK_ON) {
      this.caught = true;
      Snd.play("catch");
      Snd.duckMusic(true);
      this.mash = 0;
      this.beat = 1;
      const climb = (this.spearsEscaped || 0) * BREAK_TAPS_STEP;
      this.breakTaps = Phaser.Math.Between(BREAK_TAPS_MIN, BREAK_TAPS_MAX) + climb;
      this.fallFrom = this.arrow.y;
      this.aScale = this.arrow.scaleX;
      this.grab.setVisible(true).setScale(1);
      // The "tap fast" advice is only actionable once a spear has actually
      // caught you, so the tap pulse appears here rather than when one is
      // merely flying past. Uses this spear's real tap count.
      if (TUTORIAL_ON && practiceMode) {
        this.tapHintLeft = this.breakTaps;
        if (this.tapHintG) this.tapHintG.setVisible(true);
      }
    } else if (practiceMode) {
      this.practiceDeath();
    } else {
      this.dead = true;
    }
  }

  doStruggle(dt, real, roll) {
    this.t += dt;
    this.beat = Math.max(0, this.beat - real * BREAK_BEAT);
    this.mash = Math.max(0, this.mash - BREAK_DECAY * real);

    this.vy += GRAVITY * HIT_FALL_G * dt;
    this.arrow.y += this.vy * this.unit * dt;
    this.arrow.x -= HIT_DRIFT * this.unit * dt;
    this.spin *= Math.pow(0.75, dt);
    this.arrow.rotation += this.spin * dt;

    this.movePin();

    const togo = Math.max(1, Math.ceil(this.breakTaps - this.mash));
    const hot = this.mash > this.breakTaps * 0.6;

    this.arrow.setScale(this.aScale * (1 + this.beat * 0.11));
    this.grab
      .setText("x" + togo)
      .setPosition(this.arrow.x, this.arrow.y - this.arrow.displayHeight * 0.95)
      .setScale(1 + this.beat * 0.32)
      .setColor(hot ? "#9bffef" : "#eafcff")
      .setAlpha(0.72 + 0.28 * this.beat);

    if (this.mash >= this.breakTaps) return this.breakFree();

    const foot = this.arrow.displayHeight * ARROW_FOOT;
    if (this.arrow.y + foot >= this.groundY) {
      if (practiceMode) { this.caught = false; this.grab.setVisible(false); return this.practiceDeath(); }
      this.caught = false;
      this.dead = true;
      this.landed = false;
      this.arrow.setScale(this.aScale);
      this.grab.setVisible(false);
    }
  }

  breakFree() {
    this.caught = false;
    this.tapHintLeft = 0;
    this.spearsEscaped = (this.spearsEscaped || 0) + 1;
    Snd.duckMusic(false);
    this.dead = false;
    this.mash = 0;
    this.safeT = BREAK_SAFE;
    this.slowT = BREAK_HOLD;

    if (this.pin) {
      const px = this.pin.img.x, py = this.pin.img.y;
      this.blast(px, py, BREAK_SHARDS);
      this.ringAt(px, py);
      this.pin.img.setVisible(false).setAlpha(1);
      this.pin = null;
    }

    this.ringAt(this.arrow.x, this.arrow.y);
    this.cameras.main.flash(190, 255, 255, 255);
    this.cameras.main.shake(220, HIT_SHAKE * 0.9);

    this.arrow.clearTint();
    this.arrow.setScale(this.aScale);
    this.grab.setVisible(false);
    this.vy = BREAK_KICK;
    this.spin = 0;
    this.arrow.rotation = FLAT;
    this.stall = false;
    this.slam = false;
    this.up = 0;
    this.back = Math.max(0, (this.homeX - this.arrow.x) / this.unit);
  }

  drawGrip() {
    const g = this.spinG;
    const x = this.arrow.x, y = this.arrow.y;
    const b = this.beat;
    const grip = Phaser.Math.Clamp(this.mash / this.breakTaps, 0, 1);
    const span = this.groundY - this.fallFrom;
    const left = 1 - Phaser.Math.Clamp(span > 0 ? (y - this.fallFrom) / span : 1, 0, 1);
    const r = this.arrow.displayHeight * 0.78 * (1 + b * 0.12);
    const top = -Math.PI / 2;
    const u = this.unit;

    // Expanding shockwave rings: each tap launches one that grows and fades,
    // so mashing reads as visible progress radiating outward.
    for (let i = 0; i < 3; i++) {
      const phase = ((this.t * 0.9) + i / 3) % 1;
      const rr = r * (1 + phase * 1.5);
      const fade = (1 - phase) * 0.28;
      if (fade > 0.01) {
        g.lineStyle(2.4 * u, 0x8fe6ff, fade);
        g.strokeCircle(x, y, rr);
      }
    }
    // A brighter wave fired on each successful tap.
    if (b > 0.02) {
      const w = 1 - b;
      g.lineStyle(4 * u * b, 0xffffff, b * 0.5).strokeCircle(x, y, r * (1 + w * 1.1));
    }

    // Base ring: dark backing plus a thin cool outline.
    g.lineStyle(9 * u, 0x061826, 0.45).strokeCircle(x, y, r);
    g.lineStyle(1.5 * u, 0x2f7fb8, 0.5).strokeCircle(x, y, r);

    // Danger ring: how much altitude is left before hitting the ground.
    if (left > 0.001) {
      g.lineStyle(3 * u, 0xff7a3c, 0.5 * left);
      g.beginPath();
      g.arc(x, y, r * 1.2, top, top + Math.PI * 2 * left);
      g.strokePath();
    }

    // Progress ring: one clean arc that fills as the player mashes.
    if (grip > 0.001) {
      g.lineStyle(11 * u, 0x1f7fe0, 0.22);
      g.beginPath();
      g.arc(x, y, r, top, top + Math.PI * 2 * grip);
      g.strokePath();
      g.lineStyle(5 * u, grip > 0.65 ? 0x9bffef : 0x8fe6ff, 0.98);
      g.beginPath();
      g.arc(x, y, r, top, top + Math.PI * 2 * grip);
      g.strokePath();
    }

    // Tap pips around the ring, one per required tap.
    for (let i = 0; i < this.breakTaps; i++) {
      const a = top + (Math.PI * 2 * i) / this.breakTaps;
      const pxp = x + Math.cos(a) * r, pyp = y + Math.sin(a) * r;
      const on = this.mash >= i + 1;
      const rad = (on ? 4.4 + 2.2 * b : 2.6) * u;
      if (on) g.fillStyle(0x74e4ff, 0.2 + 0.2 * b).fillCircle(pxp, pyp, rad * 2.4);
      g.fillStyle(on ? 0xffffff : 0x123449, on ? 1 : 0.7).fillCircle(pxp, pyp, rad);
    }
  }

  doFall(dt, roll) {
    if (!this.landed) {
      this.vy += GRAVITY * HIT_FALL_G * dt;
      this.arrow.y += this.vy * this.unit * dt;
      this.arrow.x -= HIT_DRIFT * this.unit * dt;
      this.spin *= Math.pow(0.75, dt);
      this.arrow.rotation += this.spin * dt;

      const foot = this.arrow.displayHeight * ARROW_FOOT;
      if (this.arrow.y + foot >= this.groundY) {
        this.arrow.y = this.groundY - foot;
        this.arrow.rotation = LAND_NOSE;
        this.landed = true;
        this.spin = 0;
        this.blast(this.arrow.x, this.arrow.y + foot * 0.6, 18);
        this.cameras.main.shake(180, HIT_SHAKE * 0.6);
        this.logScore();
      }
    }

    this.movePin();
  }

  movePin() {
    if (!this.pin) return;
    const d = this.arrow.rotation - this.pin.base;
    const c = Math.cos(d), sn = Math.sin(d);
    this.pin.img
      .setPosition(
        this.arrow.x + this.pin.dx * c - this.pin.dy * sn,
        this.arrow.y + this.pin.dx * sn + this.pin.dy * c
      )
      .setRotation(this.pin.rot + d);
  }

  nearPath(x1, y1, x2, y2) {
    const ax = this.arrow.x, ay = this.arrow.y;
    const dx = x2 - x1, dy = y2 - y1;
    const span = dx * dx + dy * dy;
    const k = span > 0
      ? Phaser.Math.Clamp(((ax - x1) * dx + (ay - y1) * dy) / span, 0, 1)
      : 0;
    return Phaser.Math.Distance.Between(ax, ay, x1 + dx * k, y1 + dy * k);
  }

  doShield(dt, roll) {
    if (this.shieldT > 0) {
      this.shieldT -= dt;
      if (this.shieldT <= 0) {
        this.shieldT = 0;
        this.hideDome();
      } else {
        this.drawDome(this.shieldT < SHIELD_LOW);
      }
    }

    if (!this.pick) return;

    if (!this.pickOn) {
      if (this.dead || this.caught || this.intro) return;
      if (this.scriptRunning()) return;
      this.pickT -= dt;
      if (this.pickT > 0) return;
      // Roll for the pickup rather than spawning on every timer expiry,
      // which halves how often a shield actually appears.
      this.pickT = Phaser.Math.FloatBetween(SHIELD_GAP_LO, SHIELD_GAP_HI);
      if (Phaser.Math.Between(1, 100) > SHIELD_ODDS) return;
      this.pickOn = true;
      this.pickX = this.scale.width + this.pick.displayWidth;
      this.pickY = this.scale.height * Phaser.Math.FloatBetween(SHIELD_HI, SHIELD_LO);
      this.pick.setVisible(true).setAlpha(1);
      return;
    }

    this.pickX -= roll * dt;
    const bob = Math.sin(this.t * SHIELD_BOB_RATE) * this.scale.height * SHIELD_BOB;
    this.pick.setPosition(this.pickX, this.pickY + bob).setRotation(Math.sin(this.t * 1.6) * 0.14);

    const grip = this.arrow.displayHeight * ARROW_HIT + this.pick.displayHeight * SHIELD_GRAB;
    if (!this.dead && !this.caught &&
        Phaser.Math.Distance.Between(this.arrow.x, this.arrow.y, this.pick.x, this.pick.y) < grip) {
      this.takeShield();
      return;
    }

    if (this.pickX + this.pick.displayWidth < 0) this.dropPick();
  }

  dropPick() {
    this.pickOn = false;
    this.pick.setVisible(false);
    this.pickT = Phaser.Math.FloatBetween(SHIELD_GAP_LO, SHIELD_GAP_HI);
  }

  takeShield() {
    Snd.play("shield");
    this.dropPick();
    this.shieldT = SHIELD_TIME;
    this.ringAt(this.arrow.x, this.arrow.y);
    this.blast(this.arrow.x, this.arrow.y, 16);
    this.cameras.main.flash(140, 120, 230, 255);
  }

  popSpear(s) {
    s.live = false;
    s.img.setVisible(false).setAlpha(1);
    this.blast(s.x, s.y, 24);
    this.ringAt(s.x, s.y);
    this.cameras.main.shake(120, HIT_SHAKE * 0.4);
    this.spillCoins(s.x, s.y);
    this.shieldT = Math.max(0, this.shieldT - SHIELD_COST);
    if (this.shieldT <= 0) this.hideDome();
  }

  struck() {
    if (this.dead || this.caught) return;
    if (practiceMode) return this.practiceDeath();
    this.landed = false;
    this.dead = true;
    this.slowT = HIT_SLOW_TIME;
    this.vy = EAGLE_SLAM;
    this.spin = EAGLE_SPIN * Phaser.Math.FloatBetween(0.9, 1.2);
    this.arrow.setTint(0xff8080);
    this.blast(this.arrow.x, this.arrow.y);
    this.ringAt(this.arrow.x, this.arrow.y);
    this.cameras.main.shake(260, HIT_SHAKE * 1.3);
    this.cameras.main.flash(150, 255, 226, 190);
  }

  hideEagle() {
    this.eagleOn = false;
    if (this.eagle) this.eagle.setVisible(false).setAlpha(1);
  }

  popEagle() {
    this.blast(this.eagleX, this.eagleY, 22);
    this.ringAt(this.eagleX, this.eagleY);
    this.cameras.main.shake(120, HIT_SHAKE * 0.5);
    this.spillCoins(this.eagleX, this.eagleY);
    this.hideEagle();
  }

  doEagle(dt, roll) {
    if (!this.eagle) return;

    if (!this.eagleOn) {
      if (this.dead || this.caught || this.intro) return;
      if (this.scriptRunning()) return;
      this.eagleT -= dt;
      if (this.eagleT > 0) return;
      this.eagleT = Phaser.Math.FloatBetween(EAGLE_GAP_LO, EAGLE_GAP_HI);
      if (Phaser.Math.Between(1, 100) > EAGLE_ODDS) return;

      const W = this.scale.width, H = this.scale.height;
      this.eagleX = W * EAGLE_SIDE;
      this.eagleY = -H * EAGLE_TOP;
      const tx = this.arrow.x - W * EAGLE_LEAD, ty = this.arrow.y;
      const span = Math.hypot(tx - this.eagleX, ty - this.eagleY) || 1;
      this.eagleVX = (tx - this.eagleX) / span * EAGLE_SPEED;
      this.eagleVY = (ty - this.eagleY) / span * EAGLE_SPEED;
      this.eagleOn = true;
      this.eagle.setVisible(true).setAlpha(1);
      if (this.anims.exists("swoop")) this.eagle.play("swoop");
      return;
    }

    const px = this.eagleX, py = this.eagleY;
    this.eagleX += (this.eagleVX * this.unit - roll * EAGLE_RIDE) * dt;
    this.eagleY += this.eagleVY * this.unit * dt;

    const aim = EAGLE_MIRROR
      ? Math.atan2(-this.eagleVY, -this.eagleVX)
      : Math.atan2(this.eagleVY, this.eagleVX);
    this.eagle.setPosition(this.eagleX, this.eagleY).setRotation(aim + EAGLE_TILT);

    const rush = Math.hypot(this.eagleVX, this.eagleVY) || 1;
    const half = this.eagle.displayWidth * EAGLE_FILL * 0.5;
    const hx = this.eagleVX / rush * half, hy = this.eagleVY / rush * half;
    const bump = this.arrow.displayHeight * ARROW_CORE + this.eagle.displayHeight * EAGLE_THICK;
    if (!this.dead && !this.caught && this.safeT <= 0 &&
        this.nearPath(px - hx, py - hy, this.eagleX + hx, this.eagleY + hy) < bump) {
      if (this.shieldT > 0) {
        this.popEagle();
        this.shieldT = Math.max(0, this.shieldT - SHIELD_COST);
        if (this.shieldT <= 0) this.hideDome();
      } else {
        this.struck();
      }
      return;
    }

    const edge = Math.max(this.eagle.displayWidth, this.eagle.displayHeight);
    if (this.eagleY - edge > this.scale.height || this.eagleX + edge < 0) this.hideEagle();
  }

  hideHand() {
    this.handState = "idle";
    if (this.hand) this.hand.setVisible(false).setAlpha(1);
  }

  popHand() {
    this.blast(this.handX, this.groundY, 22);
    this.ringAt(this.handX, this.groundY);
    this.cameras.main.shake(120, HIT_SHAKE * 0.5);
    this.spillCoins(this.handX, this.handY);
    this.hideHand();
  }

  handTouchesArrow() {
    const hw = this.hand.displayWidth  * 0.5 * 0.35; 
    const hh = this.hand.displayHeight * 0.75; 

    const hLeft  = this.hand.x - hw;
    const hRight = this.hand.x + hw;
    
    const hTop   = this.hand.y - hh;
    const hBot   = this.hand.y;

    const aw = this.arrow.displayWidth  * 0.4;
    const ah = this.arrow.displayHeight * 0.4;
    const ax = this.arrow.x, ay = this.arrow.y;

    return ax + aw > hLeft && ax - aw < hRight &&
           ay + ah > hTop  && ay - ah < hBot;
  }
  grabHand() {
    if (this.dead || this.caught) return;
    // This sets a heavy spin and a stall without ever setting `dead`, so in
    // practice mode nothing would clear them and the arrow spun forever.
    if (practiceMode) {
      this.handState = "sinking";
      this.handSinkT = 0.6;
      this.blast(this.arrow.x, this.arrow.y);
      this.cameras.main.flash(140, 210, 245, 255);
      return this.practiceDeath();
    }
    Snd.play("hit");
    this.handState = "sinking";
    this.handSinkT = 0.6;

    this.blast(this.arrow.x, this.arrow.y);
    this.cameras.main.shake(240, HIT_SHAKE);
    this.cameras.main.flash(140, 210, 245, 255);
    this.ringAt(this.arrow.x, this.arrow.y);
    this.arrow.setTint(0xff8080);

    this.stall = true;
    
    this.vy = -HIT_KICK * 1.5; 
    
    this.arrow.x -= 30; 
    
    this.spin = (this.gust >= 0 ? -1 : 1) * SPIN_START * 2.5; 
  }

 doHand(dt, roll) {
    if (!this.hand) return;

    if (this.handState === "sinking") {
      this.handSinkT -= dt;
      this.hand.y += (this.hand.displayHeight / 0.6) * dt;
      if (this.handSinkT <= 0) this.hideHand();
      return;
    }


    if (this.handState === "closing") {
      this.handCloseT -= dt;
      this.handX -= roll * dt;
      this.hand.setPosition(this.handX, this.groundY);
      if (this.handCloseT <= 0) this.grabHand();
      return;
    }

    if (this.handState !== "rising") {
      if (this.dead || this.caught || this.intro) return;
      if (this.scriptRunning()) return;
      this.handT -= dt;
      if (this.handT > 0) return;
      this.handT = Phaser.Math.FloatBetween(HAND_GAP_LO, HAND_GAP_HI);
      if (Phaser.Math.Between(1, 100) > HAND_ODDS) return;

      const W = this.scale.width;
      this.handX = W;
      this.handState = "rising";
      this.hand.setPosition(this.handX, this.groundY + this.hand.displayHeight * 0.9)
        .setVisible(true).setAlpha(1);
      this.handRiseT = 0.35;
      if (this.anims.exists("grab")) this.hand.play("grab");
      return;
    }

    this.handX -= roll * dt;
    if (this.handRiseT > 0) {
      this.handRiseT -= dt;
      const p = 1 - Math.max(0, this.handRiseT) / 0.35;
      this.hand.y = Phaser.Math.Linear(this.groundY + this.hand.displayHeight * 0.9, this.groundY, p);
      this.hand.x = this.handX;
    } else {
      this.hand.setPosition(this.handX, this.groundY);
    }

    if (!this.dead && !this.caught && this.safeT <= 0 && this.handTouchesArrow()) {
      if (this.shieldT > 0) {
        this.popHand();
        this.shieldT = Math.max(0, this.shieldT - SHIELD_COST);
        if (this.shieldT <= 0) this.hideDome();
      } else {
        this.grabHand();
      }
      return;
    }
  }

  spareCoin() {
    for (let i = 0; i < this.coins.length; i++) if (!this.coins[i].live) return this.coins[i];
    return null;
  }

  wakeCoin(x, y, mode) {
    const c = this.spareCoin();
    if (!c) return null;
    c.live = true;
    c.mode = mode;
    c.x = x;
    c.y = y;
    c.vx = 0;
    c.vy = 0;
    c.t = 0;
    c.img.setVisible(true).setAlpha(1).setPosition(x, y).setScale(this.coinScale).setRotation(0);
    if (this.anims.exists("shine") && c.img.anims.isPaused) c.img.anims.resume();
    return c;
  }

  freeCoin(c) {
    c.live = false;
    c.img.setVisible(false);
    if (c.img.anims.isPlaying) c.img.anims.pause();
  }

  dealCoins() {
    const W = this.scale.width, H = this.scale.height;
    const many = Phaser.Math.Between(COIN_RUN_LO, COIN_RUN_HI);
    const hi = H * COIN_BAND_HI + this.coinGap * 0.5;
    const lo = H * COIN_BAND_LO - this.coinGap * 0.5;
    const kind = Phaser.Math.Between(0, 5);
    const drop = Math.min((lo - hi) * 0.95, this.coinGap * (many - 1) * 0.8);
    const mid = Phaser.Math.FloatBetween(hi + drop * 0.5, lo - drop * 0.5);
    for (let i = 0; i < many; i++) {
      const k = many < 2 ? 0.5 : i / (many - 1);
      let off = 0;
      if (kind === 1) off = (k - 0.5) * drop;
      else if (kind === 2) off = (0.5 - k) * drop;
      else if (kind === 3) off = Math.sin(k * Math.PI) * drop * 0.5;
      else if (kind === 4) off = -Math.sin(k * Math.PI * 1.5) * drop * 0.5;
      else if (kind === 5) off = (i % 2 ? 0.42 : -0.42) * drop;
      const step = kind === 5 ? this.coinGap * 0.78 : this.coinGap;
      this.wakeCoin(W + step * (i + 1), Phaser.Math.Clamp(mid + off, hi, lo), 0);
    }
  }

  spillCoins(x, y) {
    const many = Phaser.Math.Between(COIN_SPILL_LO, COIN_SPILL_HI);
    for (let i = 0; i < many; i++) {
      const c = this.wakeCoin(x, y, 1);
      if (!c) return;
      const a = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const sp = Phaser.Math.FloatBetween(220, 520);
      c.vx = Math.cos(a) * sp;
      c.vy = Math.sin(a) * sp;
    }
  }

  grabCoin(c) {
    c.mode = 2;
    c.t = 0;
    c.x = c.img.x;
    c.y = c.img.y;
    this.blast(c.x, c.y, 5);
  }

  cashCoin(c) {
    Snd.play("coin");
    this.freeCoin(c);
    // Coins no longer feed the distance score directly. They're counted
    // separately and added at the end (see logScore), so the player can see
    // exactly what their coins were worth.
    this.coinCount = (this.coinCount || 0) + 1;
    this.coinPop = 1;
    this.hudPop = 1;
    this.hudScale();
    this.coinHudScale();
    this.blast(this.coinIcon ? this.coinIcon.x : this.hud.x, this.coinIcon ? this.coinIcon.y : this.hud.y, 5);
    this.sayCoins();
  }

  coinHudScale() {
    if (!this.coinTxt) return;
    this.coinTxt.setScale((this.coinTxtFit || 1) * (1 + 0.4 * (this.coinPop || 0)));
    if (this.coinIcon) this.coinIcon.setScale((this.coinIconFit || 1) * (1 + 0.4 * (this.coinPop || 0)));
  }

  sayCoins() {
    if (!this.coinTxt) return;
    this.coinTxt.setText("x " + (this.coinCount || 0));
    this.gild(this.coinTxt, "#ffe9a8", "#c99a3f");
    this.coinHudScale();
  }

  hudScale() {
    this.hud.setScale(this.hudFit * (1 + 0.34 * this.hudPop));
  }

  doCoins(dt, roll) {
    if (this.coinPop > 0) {
      this.coinPop = Math.max(0, this.coinPop - dt * 3.4);
      this.coinHudScale();
    }
    if (this.hudPop > 0) {
      this.hudPop = Math.max(0, this.hudPop - dt * 3.4);
      this.hudScale();
    }
    if (!this.coins || !this.coins.length) return;

    // Same as doSpears: gate only the spawn timer, never the movement.
    if (!this.dead && !this.caught && !this.intro && !this.scriptRunning()) {
      this.coinT -= dt;
      if (this.coinT <= 0) {
        this.coinT = Phaser.Math.FloatBetween(COIN_EVERY_LO, COIN_EVERY_HI);
        if (Phaser.Math.Between(1, 100) <= COIN_ODDS) this.dealCoins();
      }
    }

    const H = this.scale.height;
    const sway = Math.sin(this.t * 3.2) * H * 0.008;

    for (let i = 0; i < this.coins.length; i++) {
      const c = this.coins[i];
      if (!c.live) continue;

      if (c.mode === 2) {
        c.t += dt;
        const k = Phaser.Math.Clamp(c.t / 0.45, 0, 1);
        const e = k * k * (3 - 2 * k);
        c.img.setPosition(
          Phaser.Math.Linear(c.x, this.coinIcon ? this.coinIcon.x : this.hud.x, e),
          Phaser.Math.Linear(c.y, this.coinIcon ? this.coinIcon.y : this.hud.y, e) - Math.sin(e * Math.PI) * H * 0.08
        );
        c.img.setScale(this.coinScale * (1 - 0.62 * e)).setAlpha(1 - 0.2 * e);
        c.img.rotation += 6 * dt;
        if (k >= 1) this.cashCoin(c);
        continue;
      }

      if (c.mode === 1) {
        c.t += dt;
        c.vy += GRAVITY * 0.5 * dt;
        const slow = Math.pow(0.35, dt);
        c.vx *= slow;
        c.vy *= slow;
        if (c.t > 0.25) {
          const dx = this.arrow.x - c.x, dy = this.arrow.y - c.y;
          const gap = Math.hypot(dx, dy) || 1;
          c.vx += dx / gap * 2600 * dt;
          c.vy += dy / gap * 2600 * dt;
        }
        c.x += (c.vx * this.unit - roll * 0.6) * dt;
        c.y += c.vy * this.unit * dt;
        c.img.setPosition(c.x, c.y).setRotation(c.img.rotation + 2.4 * dt);
      } else {
        c.x -= roll * dt;
        c.img.setPosition(c.x, c.y + sway);
      }

      if (!this.dead && !this.caught &&
          Phaser.Math.Distance.Between(this.arrow.x, this.arrow.y, c.img.x, c.img.y) <
          this.arrow.displayHeight * ARROW_HIT + c.img.displayHeight * COIN_GRAB) {
        this.grabCoin(c);
        continue;
      }

      if (c.x + c.img.displayWidth < 0 || c.y - c.img.displayHeight > H) this.freeCoin(c);
    }
  }

  // While practice mode is still introducing things, spread spawns out so
  // they arrive one at a time instead of piling up on a learner. Returns to
  // normal spacing once every element has been shown once.
  // True while practice mode is mid-lesson: a hint is up, or the game is
  // paused by one. Spawners check this so a second enemy never arrives
  // while the player is reading about the first.
  // Practice runs a fixed, scripted lesson before free play: one element
  // at a time, in a set order, at set positions -- not random. Random
  // spawning is disabled until the script finishes, then resumes exactly
  // as in a normal run.
  scriptRunning() {
    return practiceMode && !this.scriptDone;
  }

  tutorialDone() {
    return !!this.scriptDone;
  }

  // Is anything currently occupying the play field?
  fieldBusy() {
    if (this.eagleOn) return true;
    if (this.handState !== "idle") return true;
    if (this.pickOn) return true;
    if ((this.spears || []).some(sp => sp.live)) return true;
    if ((this.coins || []).some(c => c.live)) return true;
    return false;
  }

  // Spawners the script drives directly, mirroring what the random timers
  // would have done but at fixed, readable positions.
  scriptSpawn(kind) {
    const W = this.scale.width, H = this.scale.height;
    // Every branch is guarded: a missing pool or texture must skip the step
    // rather than hand Phaser a half-built object (which surfaces later as
    // a null glTexture during render).
    if (kind === "coin") {
      // A single coin, not dealCoins() -- that spawns a whole 5-9 coin wave,
      // so repeating it piled coins on top of each other.
      if (this.coins && this.coins.length && this.textures.exists("coin")) {
        const hi = H * COIN_BAND_HI, lo = H * COIN_BAND_LO;
        this.wakeCoin(W + this.coinGap, Phaser.Math.FloatBetween(hi, lo), 0);
      }
    } else if (kind === "spear") {
      if (this.spears && this.spears.length && this.textures.exists("spear")) this.throwSpear();
    } else if (kind === "eagle" && this.eagle && this.textures.exists("eagle")) {
      this.eagleX = W * EAGLE_SIDE;
      this.eagleY = -H * EAGLE_TOP;
      const tx = this.arrow.x - W * EAGLE_LEAD, ty = this.arrow.y;
      const span = Math.hypot(tx - this.eagleX, ty - this.eagleY) || 1;
      this.eagleVX = (tx - this.eagleX) / span * EAGLE_SPEED;
      this.eagleVY = (ty - this.eagleY) / span * EAGLE_SPEED;
      this.eagleOn = true;
      this.eagle.setVisible(true).setAlpha(1);
      if (this.anims.exists("swoop")) this.eagle.play("swoop");
    } else if (kind === "hand" && this.hand && this.textures.exists("hand")) {
      this.handX = W;
      this.handState = "rising";
      this.hand.setPosition(this.handX, this.groundY + this.hand.displayHeight * 0.9)
        .setVisible(true).setAlpha(1);
      this.handRiseT = 0.35;
      if (this.anims.exists("grab")) this.hand.play("grab");
    } else if (kind === "shield" && this.pick && this.textures.exists("shield")) {
      this.pickOn = true;
      this.pickX = W + this.pick.displayWidth;
      // Fixed height, level with the arrow, so it's an easy first grab.
      this.pickY = this.arrow.y;
      this.pick.setVisible(true).setAlpha(1);
    }
  }

  // Advances the scripted lesson. Each step spawns its element `count`
  // times, then waits for the field to clear before moving on. The timeout
  // means a step can never wedge the lesson permanently.
  runScript(dt) {
    if (!this.scriptRunning()) return;
    if (this.dead || this.caught) return;
    // Paused while a hint or popup is being read.
    if (this.hintShown || this.tutShown || this.contShown) return;

    const step = PRACTICE_SCRIPT[this.scriptStep];
    if (!step) { this.finishScript(); return; }

    this.scriptAge += dt;
    this.scriptGap -= dt;

    // Still spawning this step's repeats.
    if (this.scriptLeft > 0) {
      if (this.scriptGap > 0) return;
      this.scriptSpawn(step.kind);
      this.scriptLeft--;
      this.scriptGap = PRACTICE_SPAWN_GAP;
      return;
    }

    // All spawned: wait for the field to clear, then pause before the next
    // step. The timeout stops a stuck object from ending the lesson.
    if (this.fieldBusy() && this.scriptAge < PRACTICE_STEP_TIMEOUT) return;
    if (this.scriptGap > 0) return;
    this.nextScriptStep();
  }

  nextScriptStep() {
    this.scriptStep++;
    if (this.scriptStep >= PRACTICE_SCRIPT.length) { this.finishScript(); return; }
    const step = PRACTICE_SCRIPT[this.scriptStep];
    this.scriptLeft = step.count || 1;
    this.scriptGap = step.gap || PRACTICE_STEP_GAP;
    this.scriptAge = 0;
  }

  finishScript() {
    if (this.scriptDone) return;
    this.scriptDone = true;
    this.showHint(null, TUTORIAL_CARDS.freeplay);
  }

  // Removes everything currently on the field. Used when resuming in
  // practice mode so the player isn't dropped straight back on top of the
  // spear that just got them.
  clearField() {
    (this.spears || []).forEach(sp => {
      sp.live = false;
      sp.down = false;
      sp.img.setVisible(false).setAlpha(1);
    });
    this.spearT = SPEAR_WAIT;
    this.eagleOn = false;
    this.eagleT = EAGLE_WAIT;
    if (this.eagle) this.eagle.setVisible(false).setAlpha(1);
    this.handState = "idle";
    this.handT = HAND_WAIT;
    if (this.hand) this.hand.setVisible(false).setAlpha(1);
    this.pickOn = false;
    this.pickT = SHIELD_WAIT;
    if (this.pick) this.pick.setVisible(false);
    (this.coins || []).forEach(c => this.freeCoin(c));
    this.coinT = 2;
    this.bits.length = 0;
    this.rings.length = 0;
    [this.spinG, this.zipG, this.tapHintG].forEach(g => { if (g) g.clear(); });
    this.tapDrawn = false;
  }

  // Practice deaths pause and ask whether to carry on, so the mode still
  // teaches consequences instead of being an unloseable sandbox. Score and
  // speed carry over; only the field is cleared.
  practiceDeath() {
    if (this.contShown || this.overShown) return;
    Snd.play("hit");
    Snd.duckMusic(false);
    this.halt = true;
    this.showContinuePopup();
  }

  practiceRecover() {
    Snd.play("hit");
    this.dead = false;
    this.landed = false;
    this.caught = false;
    this.stall = false;
    this.slam = false;
    this.spin = 0;
    this.slowT = 0;
    this.pin = null;
    this.mash = 0;
    if (this.grab) this.grab.setVisible(false);
    Snd.duckMusic(false);

    const H = this.scale.height;
    // Put the arrow back inside the play area if it drifted out.
    this.arrow.x = Phaser.Math.Clamp(this.arrow.x, this.scale.width * 0.18, this.scale.width * 0.8);
    this.arrow.y = Phaser.Math.Clamp(this.arrow.y, H * 0.2, this.groundY - this.arrow.displayHeight);
    this.arrow.rotation = FLAT;
    this.arrow.setScale(this.aScale || this.arrow.scaleX);
    this.arrow.setAlpha(1);

    this.vy = FLAP * 1.4;
    this.up = 0;
    this.safeT = Math.max(this.safeT, BREAK_SAFE);
    this.arrow.setTint(0xffd0d0);
    this.time.delayedCall(300, () => { if (this.arrow) this.arrow.clearTint(); });
    this.cameras.main.shake(160, HIT_SHAKE * 0.5);
  }

  bail(why) {
    if (practiceMode) return this.practiceDeath();
    Snd.play("hit");
    Snd.duckMusic(false);
    this.dead = true;
    this.landed = true;
    this.spin = 0;
    this.arrow.rotation = LAND_NOSE;
    this.arrow.y = Math.min(this.arrow.y, this.groundY - this.arrow.displayHeight * ARROW_FOOT);
    this.arrow.setTint(0xff8080);
    this.logScore();
  }

  logScore() {
    const distScore = Math.floor(this.dist * KM_PER_PX * SCORE_UNIT);
    const coins = this.coinCount || 0;
    const coinScore = coins * COIN_VALUE;
    const total = distScore + coinScore;
    this.sayScore(distScore);
    if (total > this.best) {
      this.best = total;
      keepBest(total);
      this.showBest();
    }
    addToBoard("YOU", total);
    this.showGameOverPopup(distScore, coins, coinScore, total);
  }

  boostAmt() {
    if (Math.abs(this.gust) < BOOST_WIND_MIN) return 0;
    const a = this.gust >= 0 ? this.arrow.rotation - FLAT : FLAT - this.arrow.rotation;
    if (a <= BOOST_IN) return 0;
    if (a < BOOST_LO) return (a - BOOST_IN) / (BOOST_LO - BOOST_IN);
    if (a <= BOOST_HI) return 1;
    if (a < BOOST_OUT) return Phaser.Math.Linear(1, BOOST_TAIL, (a - BOOST_HI) / (BOOST_OUT - BOOST_HI));
    return BOOST_TAIL;
  }

  throwSpear() {
    const s = this.spears.find(o => !o.live);
    if (!s) return;

    const H = this.scale.height;
    s.live = true;
    s.down = false;
    s.x = this.scale.width * (1 + SPEAR_START_X) + s.img.displayWidth * 0.7;
    s.y = this.groundY * Phaser.Math.FloatBetween(SPEAR_FROM_LO, SPEAR_FROM_HI);

    if (Phaser.Math.Between(1, 100) <= SPEAR_AIM_CHANCE) {
      const flight = Phaser.Math.FloatBetween(SPEAR_TIME_LO, SPEAR_TIME_HI);
      const tx = this.arrow.x;
      const ty = this.arrow.y + Phaser.Math.FloatBetween(-SPEAR_MISS, SPEAR_MISS) * H;
      const carry = this.spd * this.unit * SPEAR_RIDE;
      s.vx = ((tx - s.x) / flight + carry) / this.unit;
      s.vy = (ty - s.y) / (this.unit * flight) - 0.5 * SPEAR_FALL * flight;
    } else {
      s.vx = -Phaser.Math.FloatBetween(SPEAR_PUSH_LO, SPEAR_PUSH_HI);
      s.vy = -Phaser.Math.FloatBetween(SPEAR_LIFT_LO, SPEAR_LIFT_HI);
    }

    const rise = Math.max(H * 0.1, s.y - H * SPEAR_CEIL);
    const cap = Math.sqrt(2 * SPEAR_FALL * rise / this.unit);
    if (s.vy < -cap) s.vy = -cap;

    s.img.setVisible(true).setAlpha(1).setFlipX(SPEAR_MIRROR);
  }

  doSpears(dt, roll) {
    if (!this.spears.length) return;

    // Note the `!scriptRunning()` here rather than an early return: a
    // `return` would exit doSpears entirely and skip the movement code
    // below, which left scripted spears frozen where they spawned.
    if (!this.dead && !this.caught && !this.intro && !this.scriptRunning()) {
      this.spearT -= dt;
      if (this.spearT <= 0) {
        this.throwSpear();
        if (Phaser.Math.Between(1, 100) <= SPEAR_DOUBLE_CHANCE) {
          this.time.delayedCall(Phaser.Math.Between(180, 420), () => {
            if (!this.dead && !this.caught) this.throwSpear();
          });
        }
        this.spearT = Phaser.Math.FloatBetween(SPEAR_GAP_LO, SPEAR_GAP_HI);
      }
    }

    const reach = this.arrow.displayHeight * ARROW_CORE;

    this.spears.forEach(s => {
      if (!s.live) return;

      if (s.down) {
        s.x -= roll * SPEAR_RIDE * dt;
        s.rest -= dt;
        s.img.setPosition(s.x, s.y).setAlpha(Phaser.Math.Clamp(s.rest / SPEAR_STICK, 0, 1));
        if (s.rest <= 0 || s.x + s.img.displayWidth < 0) {
          s.live = false;
          s.img.setVisible(false).setAlpha(1);
        }
        return;
      }

      const px = s.x, py = s.y;

      s.vy += SPEAR_FALL * dt;
      s.x += (s.vx * this.unit - roll * SPEAR_RIDE) * dt;
      s.y += s.vy * this.unit * dt;

      const aim = SPEAR_MIRROR ? Math.atan2(-s.vy, -s.vx) : Math.atan2(s.vy, s.vx);
      s.img.setPosition(s.x, s.y).setRotation(aim + SPEAR_TILT);

      const rush = Math.hypot(s.vx, s.vy) || 1;
      const half = s.img.displayWidth * SPEAR_FILL * 0.5;
      const hx = s.vx / rush * half, hy = s.vy / rush * half;

      if (!this.dead && !this.caught && this.safeT <= 0 &&
          this.nearPath(px - hx, py - hy, s.x + hx, s.y + hy) < reach + half * 2 * SPEAR_THICK) {
        if (this.shieldT > 0) this.popSpear(s);
        else this.smash(s);
        return;
      }

      if (s.y >= this.groundY) {
        s.y = this.groundY;
        s.down = true;
        s.rest = SPEAR_STICK;
        s.img.setPosition(s.x, s.y);
        this.blast(s.x, s.y, 8);
        return;
      }

      if (s.x + s.img.displayWidth < 0) {
        s.live = false;
        s.img.setVisible(false);
      }
    });
  }

  newGust() {
    this.gustT = Phaser.Math.FloatBetween(1.2, 2.6);
    this.want = Phaser.Math.Between(1, 100) <= WIND_UP_CHANCE
      ? -Phaser.Math.Between(0, WIND_UP_MAX)
      : Phaser.Math.Between(0, WIND_DOWN_MAX);
  }

  drawDome(low) {
    const t = this.t;
    const r = this.arrow.displayHeight * DOME_R * (1 + Math.sin(t * 3.4) * 0.035);
    const flick = low ? 0.45 + Math.abs(Math.sin(t * 22)) * 0.55 : 1;
    const span = r * 2.3;

    this.dome.setVisible(true).setPosition(this.arrow.x, this.arrow.y)
      .setDisplaySize(span, span)
      .setTint(low ? 0xff9c5a : 0x2b9cff)
      .setAlpha(0.62 * flick);

    if (this.qual < 1) {
      this.domeSpin.setVisible(false);
      return;
    }

    this.domeSpin.setVisible(true).setPosition(this.arrow.x, this.arrow.y)
      .setDisplaySize(span, span)
      .setTint(low ? 0xffd2a8 : 0xdffaff)
      .setAlpha(0.6 * flick)
      .setRotation(t * DOME_SPIN);
  }

  hideDome() {
    if (this.dome) this.dome.setVisible(false);
    if (this.domeSpin) this.domeSpin.setVisible(false);
  }

  soften(...keys) {
    const list = keys.length || !this.textures.getTextureKeys ? keys : this.textures.getTextureKeys();
    list.forEach(k => {
      if (this.textures.exists(k)) this.textures.get(k).setFilter(Phaser.Textures.FilterMode.LINEAR);
    });
  }

  doAir(dt, roll) {
    const W = this.scale.width, H = this.scale.height;
    const down = Phaser.Math.Clamp(Math.max(this.gust, 0) / WIND_DOWN_MAX, 0, 1);
    const lift = Phaser.Math.Clamp(Math.max(-this.gust, 0) / WIND_UP_MAX, 0, 1);
    const hard = Math.max(down, lift);
    const col = this.gust >= 0 ? WIND_DOWN_COLOR : WIND_UP_COLOR;
    // Downdraft streaks lean down-forward, updraft leans up-forward, so the
    // direction reads at a glance instead of relying on tint alone.
    const way = this.gust >= 0 ? 1 : -1;
    const flow = way * hard * 34;

    const lim = Math.round(WAVE_COUNT * this.qual);

    // Calm air: hide the field once, then skip the whole loop until the
    // wind picks up again. This is the common case, so it matters.
    if (hard <= 0.03) {
      if (this.airVisible) {
        this.air.forEach(p => p.img.setVisible(false));
        this.airVisible = false;
      }
    } else {
      this.airVisible = true;
      const tintChanged = (this.airTint !== col);
      this.airTint = col;
      const stretchX = 1 + hard * 1.15;
      const stretchY = 0.9 - hard * 0.28;

      for (let ix = 0; ix < this.air.length; ix++) {
        const p = this.air[ix];
        if (ix >= lim) { if (p.img.visible) p.img.setVisible(false); continue; }

        // One sin per particle per frame instead of three: the same wave
        // drives sway, angle wobble and the alpha pulse.
        const wave = Math.sin(this.t * p.sway + p.ph);

        p.x -= (roll * p.par * (1 + hard) + Math.abs(this.gust) * this.unit * 0.6) * dt;
        p.y += (this.gust * 1.5 + wave * 26) * this.unit * dt;

        if (p.x + p.len < 0) {
          p.x = W + Phaser.Math.FloatBetween(0, W * 0.5);
          p.y = Phaser.Math.FloatBetween(0, H);
          p.img.setTexture("puff" + Phaser.Math.Between(0, WAVE_KINDS - 1)).setFlipY(Math.random() < 0.5);
          p.len = p.img.displayWidth;
        }
        if (p.y < -H * 0.1) p.y += H * 1.2;
        if (p.y > H * 1.1) p.y -= H * 1.2;

        p.img.setPosition(p.x, p.y);
        p.img.setAngle(flow + p.lean + wave * 6);
        p.img.setScale(p.sx * stretchX, p.sy * stretchY);
        p.img.setAlpha(p.dim * hard * (0.75 + wave * 0.25) * 1.05);
        // setTint writes four corner colours, so only do it when the wind
        // direction actually flips rather than every frame.
        if (tintChanged) p.img.setTint(col);
        if (!p.img.visible) p.img.setVisible(true);
      }
    }

    // Rebuilding Graphics geometry is expensive, so the wind hint is
    // redrawn on a fixed cadence rather than every frame. At this size and
    // motion the difference is invisible, but it removes a full geometry
    // rebuild from most frames.
    this.windTick = (this.windTick || 0) + 1;
    if (this.windTick % WIND_HINT_EVERY === 0) this.drawWindHint(hard, way, col);
  }

  // A soft directional glow banked against the top or bottom edge, so even
  // a glance at the screen edge tells you which way the wind is pushing.
  drawWindHint(hard, way, col) {
    if (!this.windG) return;
    // Skip the clear entirely once it's already empty, so calm air costs
    // nothing at all.
    if (hard <= 0.05) {
      if (!this.windDrawn) return;
      this.windG.clear();
      this.windDrawn = false;
      return;
    }
    this.windG.clear();
    this.windDrawn = true;
    const W = this.scale.width, H = this.scale.height;
    const bandH = H * 0.14 * hard;
    const puls = 0.8 + Math.sin(this.t * 3.2) * 0.2;
    const a = 0.16 * hard * puls;

    // Glow hugs the edge the wind is pushing you toward.
    if (way > 0) {
      this.windG.fillGradientStyle(col, col, col, col, 0, 0, a, a);
      this.windG.fillRect(0, H - bandH, W, bandH);
    } else {
      this.windG.fillGradientStyle(col, col, col, col, a, a, 0, 0);
      this.windG.fillRect(0, 0, W, bandH);
    }

    // Chevrons drift in the direction the wind pushes and point that way
    // too: downwind travels down the bottom band, updraft travels up the
    // top band.
    const cols = 5;
    const size = H * 0.018 * (0.7 + hard * 0.6);
    for (let i = 0; i < cols; i++) {
      const cx = W * ((i + 0.5) / cols);
      const cycle = (this.t * (0.5 + hard * 0.9) + i * 0.23) % 1;
      const cy = way > 0
        ? (H - bandH) + cycle * bandH * 0.9      // downwind: top of band -> bottom
        : bandH - cycle * bandH * 0.9;           // updraft: bottom of band -> top
      const fade = Math.sin(cycle * Math.PI) * hard * 0.85;
      if (fade <= 0.02) continue;
      this.windG.lineStyle(Math.max(1, 2.2 * this.unit), col, fade);
      this.windG.beginPath();
      // Apex leads the direction of travel.
      this.windG.moveTo(cx - size, cy - size * 0.6 * way);
      this.windG.lineTo(cx, cy + size * 0.6 * way);
      this.windG.lineTo(cx + size, cy - size * 0.6 * way);
      this.windG.strokePath();
    }
  }

  squeeze(t, maxw) {
    t.setScale(1);
    if (maxw > 0 && t.width > maxw) t.setScale(maxw / t.width);
  }

  setPause(on) {
    this.halt = on;
    this.veil.setVisible(on);
    this.resumeImg.setVisible(on);
    this.menuImg.setVisible(on);
    if (this.pauseBtn) this.pauseBtn.setAlpha(on ? 1 : PAUSE_DIM);
    if (on) {
      if (this.arrow.anims.isPlaying) this.arrow.anims.pause();
      this.spears.forEach(s => s.img.anims.pause());
      if (this.pick) this.pick.anims.pause();
    } else {
      if (!this.dead && !this.caught) this.arrow.anims.resume();
      this.spears.forEach(s => s.img.anims.resume());
      if (this.pick) this.pick.anims.resume();
    }
  }

  hitPause(gx, gy) {
    // No pausing once the run has ended; the game-over popup owns the
    // screen at that point.
    if (!this.pauseBtn || this.dead || this.overShown) return false;
    const b = this.pauseBtn.getBounds();
    const pad = this.unit * PAUSE_PAD;
    if (gx < b.x - pad || gx > b.right + pad || gy < b.y - pad || gy > b.bottom + pad) return false;
    this.setPause(!this.halt);
    return true;
  }

  hitPopup(gx, gy) {
    if (!this.halt) return false;
    const r = this.resumeRect;
    if (r && gx >= r.x && gx <= r.x + r.w && gy >= r.y && gy <= r.y + r.h) {
      this.setPause(false);
      return true;
    }
    const m = this.menuRect;
    if (m && gx >= m.x && gx <= m.x + m.w && gy >= m.y && gy <= m.y + m.h) {
      this.scene.start("Menu");
      return true;
    }
    return false;
  }

  // ---- Opening card (pauses until CONTINUE) --------------------------------

  layoutTutorial() {
    const W = this.scale.width, H = this.scale.height;
    const pw = Math.min(W * 0.8, H * 1.15);
    const px = W * 0.5;

    this.tutTitle.setFontSize(Math.round(H * 0.055));
    this.tutBody.setWordWrapWidth(pw * 0.84);
    this.tutBody.setFontSize(Math.round(H * 0.030));
    this.tutBtnTxt.setFontSize(Math.round(H * 0.032));

    const padY = H * 0.03;
    const btnH = Math.max(H * 0.085, 46 * (window.devicePixelRatio || 1));
    const btnW = pw * 0.5;
    const ph = padY * 2 + this.tutTitle.height + this.tutBody.height + btnH + H * 0.05;
    const py = H * 0.5;
    const r = Math.min(ph, pw) * 0.07;

    this.tutPanel.clear();
    this.tutPanel.fillStyle(0x000000, 0.62);
    this.tutPanel.fillRect(0, 0, W, H);
    this.tutPanel.fillStyle(0x081722, 0.97);
    this.tutPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);
    this.tutPanel.fillGradientStyle(0xffffff, 0xffffff, 0x9fc4dc, 0x9fc4dc, 0.07, 0.07, 0.0, 0.0);
    this.tutPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph * 0.28, { tl: r, tr: r, bl: 0, br: 0 });
    this.tutPanel.lineStyle(Math.max(1, Math.round(H * 0.0024)), 0xffe9a8, 0.75);
    this.tutPanel.strokeRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);

    let y = py - ph / 2 + padY + this.tutTitle.height * 0.5;
    this.tutTitle.setPosition(px, y);
    fitTextWidth(this.tutTitle, H * 0.055, pw * 0.85, 14);
    this.gild(this.tutTitle, "#ffe9a8", "#c99a3f");
    y += this.tutTitle.height * 0.5 + H * 0.022;

    this.tutBody.setPosition(px, y + this.tutBody.height * 0.5);
    y += this.tutBody.height + H * 0.03;

    const by = y + btnH * 0.5;
    this.tutBtn.clear();
    this.tutBtn.fillStyle(0x000000, 0.35);
    this.tutBtn.fillRoundedRect(px - btnW / 2, by - btnH / 2 + H * 0.005, btnW, btnH, btnH * 0.3);
    this.tutBtn.fillGradientStyle(BTN_GOLD_TOP, BTN_GOLD_TOP, BTN_GOLD_BOT, BTN_GOLD_BOT, 1);
    this.tutBtn.fillRoundedRect(px - btnW / 2, by - btnH / 2, btnW, btnH, btnH * 0.3);
    this.tutBtn.lineStyle(Math.max(1, Math.round(H * 0.002)), BTN_GOLD_LINE, 0.9);
    this.tutBtn.strokeRoundedRect(px - btnW / 2, by - btnH / 2, btnW, btnH, btnH * 0.3);
    this.tutBtnTxt.setPosition(px, by);
    fitTextWidth(this.tutBtnTxt, H * 0.032, btnW * 0.8, 11);
    this.tutBtnRect = { x: px - btnW / 2, y: by - btnH / 2, w: btnW, h: btnH };

  }

  showTutorialCard(card) {
    this.tutShown = true;
    this.tutOpenedAt = this.time.now;
    this.tutLastTap = 0;
    // Fully pauses the run: nothing moves and no distance is counted until
    // the player presses CONTINUE, so reading the card can't cost them the
    // arrow or any progress.
    this.halt = true;
    this.tutTitle.setText(card.title);
    this.tutBody.setText(card.lines.join("\n\n"));
    const group = [this.tutPanel, this.tutTitle, this.tutBody, this.tutBtn, this.tutBtnTxt];
    group.forEach(o => o.setVisible(true).setAlpha(0));
    this.layoutTutorial();
    this.tweens.add({ targets: group, alpha: 1, duration: 220, ease: "Quad.easeOut" });
  }

  hideTutorialCard() {
    if (!this.tutShown) return;
    this.tutShown = false;
    const group = [this.tutPanel, this.tutTitle, this.tutBody, this.tutBtn, this.tutBtnTxt];
    this.tweens.add({
      targets: group, alpha: 0, duration: 180, ease: "Quad.easeIn",
      onComplete: () => group.forEach(o => o.setVisible(false))
    });
    // Resume, and restart the run cleanly from zero so the time spent
    // reading never counts against the player's distance.
    this.halt = false;
    this.resetRunProgress();
  }

  contGroup() {
    return [this.contPanel, this.contTitle, this.contBody,
            this.contYes, this.contYesTxt, this.contNo, this.contNoTxt].filter(Boolean);
  }

  layoutContinue() {
    const W = this.scale.width, H = this.scale.height;
    const pw = Math.min(W * 0.78, H * 1.25), ph = H * 0.46;
    const px = W * 0.5, py = H * 0.5;
    const r = Math.min(pw, ph) * 0.08;

    this.contPanel.clear();
    this.contPanel.fillStyle(0x000000, 0.6);
    this.contPanel.fillRect(0, 0, W, H);
    this.contPanel.fillStyle(0x081722, 0.97);
    this.contPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);
    this.contPanel.fillGradientStyle(0xffffff, 0xffffff, 0x9fc4dc, 0x9fc4dc, 0.07, 0.07, 0, 0);
    this.contPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph * 0.3, { tl: r, tr: r, bl: 0, br: 0 });
    this.contPanel.lineStyle(Math.max(1, Math.round(H * 0.0024)), 0xffe9a8, 0.75);
    this.contPanel.strokeRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);

    this.contTitle.setPosition(px, py - ph * 0.3);
    fitTextWidth(this.contTitle, ph * 0.14, pw * 0.85, 14);
    this.gild(this.contTitle, "#ffe9a8", "#c99a3f");

    this.contBody.setWordWrapWidth(pw * 0.82);
    this.contBody.setPosition(px, py - ph * 0.04);
    fitTextWidth(this.contBody, ph * 0.065, pw * 0.82, 10);

    const minTouch = Math.max(44 * (window.devicePixelRatio || 1), H * 0.075);
    const bw = pw * 0.4, bh = Math.max(ph * 0.16, minTouch);
    const by = py + ph * 0.3;

    const yx = px - pw * 0.22;
    paintButton(this.contYes.setPosition(yx, by), bw, bh, BTN_GOLD_TOP, BTN_GOLD_BOT, BTN_GOLD_LINE);
    this.contYesTxt.setPosition(yx, by);
    fitTextWidth(this.contYesTxt, bh * 0.34, bw * 0.85, 10);
    this.contYesRect = { x: yx - bw / 2, y: by - bh / 2, w: bw, h: bh };

    const nx = px + pw * 0.22;
    paintButton(this.contNo.setPosition(nx, by), bw, bh, BTN_TEAL_TOP, BTN_TEAL_BOT, BTN_TEAL_LINE);
    this.contNoTxt.setPosition(nx, by);
    fitTextWidth(this.contNoTxt, bh * 0.34, bw * 0.85, 10);
    this.contNoRect = { x: nx - bw / 2, y: by - bh / 2, w: bw, h: bh };
  }

  showContinuePopup() {
    this.contShown = true;
    this.contOpenedAt = this.time.now;
    const dist = Math.floor(this.dist * KM_PER_PX * SCORE_UNIT);
    this.contBody.setText("Practice run - your score and speed are kept.\nScore so far: " +
      comma(dist + (this.coinCount || 0) * COIN_VALUE));
    const g = this.contGroup();
    g.forEach(o => o.setVisible(true).setAlpha(0));
    this.layoutContinue();
    this.tweens.add({ targets: g, alpha: 1, duration: 200, ease: "Quad.easeOut" });
  }

  hideContinuePopup() {
    this.contShown = false;
    this.contGroup().forEach(o => o.setVisible(false));
  }

  hitContinue(gx, gy) {
    if (!this.contShown) return true;
    // Same in-flight-tap guard as the tutorial cards.
    if (this.time.now - (this.contOpenedAt || 0) < 500) return true;
    const y = this.contYesRect, n = this.contNoRect;
    if (y && gx >= y.x && gx <= y.x + y.w && gy >= y.y && gy <= y.y + y.h) {
      this.hideContinuePopup();
      this.clearField();
      this.practiceRecover();
      this.halt = false;
      return true;
    }
    if (n && gx >= n.x && gx <= n.x + n.w && gy >= n.y && gy <= n.y + n.h) {
      this.hideContinuePopup();
      this.halt = false;
      // Finish for real: fall through to the normal game-over flow.
      this.dead = true;
      this.landed = true;
      this.spin = 0;
      this.arrow.rotation = LAND_NOSE;
      this.logScore();
      return true;
    }
    return true;
  }

  // A card can be dismissed once it has been up for TUTORIAL_TAP_GUARD_MS,
  // or immediately on a double tap. This stops a tap that was already in
  // flight when the card appeared from closing it before it can be read.
  tutTapAllowed() {
    // Simply ignore taps until the card has been up long enough to read.
    // No double-tap shortcut: it made an in-flight burst of taps skip the
    // card, which is the exact problem the guard exists to prevent.
    return (this.time.now - (this.tutOpenedAt || 0)) >= TUTORIAL_TAP_GUARD_MS;
  }

  hitTutorial(gx, gy) {
    if (!this.tutShown) return false;
    // Tapping anywhere dismisses it; the CONTINUE button is there to make
    // that obvious rather than to be the only target.
    // No delay here: this card has a visible CONTINUE button, so a tap is
    // always deliberate. The guard only matters for the bottom hints,
    // which appear unannounced mid-play.
    this.hideTutorialCard();
    return true;
  }

  // Zeroes distance/score without disturbing the world, used after the
  // opening card so the run genuinely starts at 0 m.
  resetRunProgress() {
    this.dist = 0;
    this.scoreT = 0;
    this.t = 0;
    this.spd = BG_SPEED;
    this.sayScore(0);
    startScoreSession();
  }

  // ---- Bottom hint strip (never blocks play) -------------------------------

  layoutHint() {
    const W = this.scale.width, H = this.scale.height;
    const pw = Math.min(W * 0.92, H * 1.5);
    const px = W * 0.5;
    const ph = Math.max(H * 0.1, 54 * (window.devicePixelRatio || 1));
    const py = H - ph * 0.5 - H * 0.03;
    const r = ph * 0.24;

    this.hintPanel.clear();
    this.hintPanel.fillStyle(0x000000, 0.3);
    this.hintPanel.fillRoundedRect(px - pw / 2, py - ph / 2 + H * 0.005, pw, ph, r);
    this.hintPanel.fillStyle(0x081722, 0.93);
    this.hintPanel.fillRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);
    this.hintPanel.lineStyle(Math.max(1, Math.round(H * 0.002)), 0xffe9a8, 0.6);
    this.hintPanel.strokeRoundedRect(px - pw / 2, py - ph / 2, pw, ph, r);

    const pad = pw * 0.035;
    let x = px - pw / 2 + pad;
    if (this.hintSprite && this.hintSprite.visible && this.hintSprite.frame && this.hintSprite.frame.height) {
      const sh = ph * 0.62;
      this.hintSprite.setScale(sh / this.hintSprite.frame.height);
      this.hintSprite.setPosition(x + this.hintSprite.displayWidth * 0.5, py);
      x += this.hintSprite.displayWidth + pad * 0.8;
    }

    const textW = (px + pw / 2 - pad) - x;
    this.hintTitle.setFontSize(Math.round(ph * 0.3));
    fitTextWidth(this.hintTitle, ph * 0.3, textW, 10);
    this.hintTitle.setPosition(x, py - ph * 0.17);
    this.gild(this.hintTitle, "#ffe9a8", "#c99a3f");

    this.hintBody.setWordWrapWidth(textW);
    this.hintBody.setFontSize(Math.round(ph * 0.24));
    fitTextWidth(this.hintBody, ph * 0.24, textW, 9);
    this.hintBody.setPosition(x, py + ph * 0.18);

  }

  showHint(key, card) {
    this.hintShown = true;
    this.tutOpenedAt = this.time.now;
    this.tutLastTap = 0;
    // Kill any sprite from a previous hint before making a new one, and
    // cancel tweens still targeting it -- a tween finishing against a
    // destroyed sprite is a classic null-glTexture crash.
    if (this.hintSprite) {
      this.tweens.killTweensOf(this.hintSprite);
      this.hintSprite.destroy();
      this.hintSprite = null;
    }
    if (key && this.textures.exists(key)) {
      this.hintSprite = this.add.image(0, 0, key, 0).setOrigin(0.5).setDepth(13);
    }
    this.hintTitle.setText(card.title);
    this.hintBody.setText(card.text + "   (TAP TO CONTINUE)");

    const group = [this.hintPanel, this.hintTitle, this.hintBody].concat(this.hintSprite ? [this.hintSprite] : []);
    group.forEach(o => o.setVisible(true).setAlpha(0));
    this.layoutHint();
    this.tweens.add({ targets: group, alpha: 1, duration: 200, ease: "Quad.easeOut" });

    // Stop the game completely and wait for a tap to resume, so the hint
    // can be read without anything moving or any effects running.
    this.halt = true;
    this.tutSlow = 1;

    // Optional "tap here" pulse showing where and roughly how many times.
    this.tapHintLeft = card.taps || 0;
    if (this.tapHintLeft > 0) this.tapHintG.setVisible(true);
  }

  hideHint() {
    if (!this.hintShown) return;
    this.hintShown = false;
    this.tutSlow = 1;
    this.halt = false;
    if (this.hintTimer) { this.hintTimer.remove(); this.hintTimer = null; }
    this.tapHintLeft = 0;
    this.tapHintG.setVisible(false).clear();
    const sprite = this.hintSprite;
    const group = [this.hintPanel, this.hintTitle, this.hintBody].concat(sprite ? [sprite] : []);
    this.tweens.add({
      targets: group, alpha: 0, duration: 180, ease: "Quad.easeIn",
      onComplete: () => {
        [this.hintPanel, this.hintTitle, this.hintBody].forEach(o => o.setVisible(false));
        if (sprite && sprite.scene && sprite.destroy) sprite.destroy();
        if (this.hintSprite === sprite) this.hintSprite = null;
        if (this.hintQueue.length) {
          const next = this.hintQueue.shift();
          this.showHint(next.key, next.card);
        }
      }
    });
  }

  drawTapHint() {
    if (!this.tapHintG) return;
    if (!this.tapHintLeft || this.dead || this.halt) {
      // Only pay for a clear on the frame it actually becomes empty.
      if (this.tapDrawn) { this.tapHintG.clear(); this.tapDrawn = false; }
      return;
    }
    this.tapHintG.clear();
    this.tapDrawn = true;
    const x = this.arrow.x, y = this.arrow.y;
    const base = this.arrow.displayHeight * 0.95;
    const u = this.unit;
    for (let i = 0; i < 2; i++) {
      const phase = ((this.t * 1.5) + i * 0.5) % 1;
      const rr = base * (0.55 + phase * 0.75);
      const fade = (1 - phase) * 0.55;
      if (fade <= 0.02) continue;
      this.tapHintG.lineStyle(2.6 * u, 0xffe9a8, fade);
      this.tapHintG.strokeCircle(x, y, rr);
    }
    // Remaining-tap pips beneath the arrow.
    const n = Math.min(this.tapHintLeft, 8);
    const gap = base * 0.22, w = (n - 1) * gap;
    for (let i = 0; i < n; i++) {
      this.tapHintG.fillStyle(0xffe9a8, 0.85);
      this.tapHintG.fillCircle(x - w / 2 + i * gap, y + base * 0.95, 3.2 * u);
    }
  }

  // Puts a fast-moving element back at the start of its approach, so after
  // the hint is dismissed the player sees the whole move instead of the
  // last frame of it.
  rewindForHint(key) {
    const W = this.scale.width, H = this.scale.height;
    if (key === "eagle" && this.eagleOn && this.eagle) {
      this.eagleX = W * EAGLE_SIDE;
      this.eagleY = -H * EAGLE_TOP;
      const tx = this.arrow.x - W * EAGLE_LEAD, ty = this.arrow.y;
      const span = Math.hypot(tx - this.eagleX, ty - this.eagleY) || 1;
      this.eagleVX = (tx - this.eagleX) / span * EAGLE_SPEED;
      this.eagleVY = (ty - this.eagleY) / span * EAGLE_SPEED;
      this.eagle.setPosition(this.eagleX, this.eagleY);
      if (this.anims.exists("swoop")) this.eagle.play("swoop");
    } else if (key === "hand" && this.handState === "rising" && this.hand) {
      this.handX = W;
      this.hand.setPosition(this.handX, this.groundY + this.hand.displayHeight * 0.9);
      this.handRiseT = 0.35;
      if (this.anims.exists("grab")) this.hand.play("grab");
    }
  }

  // Enemies spawn off the right edge, so triggering a hint at spawn time
  // meant the player was reading about something they couldn't see yet.
  // Instead this runs each frame and fires only once a thing has travelled
  // TUTORIAL_REVEAL_X of the screen width inward from the right edge.
  checkTutorialReveal() {
    // contShown was missing here: an eagle (or any) collision can open the
    // "keep going?" popup the same frame it becomes visible, and without
    // this guard a hint could still fire right after -- rewinding the
    // eagle off-screen to replay its approach just as the player is being
    // asked whether to continue. By the time both were dismissed the eagle
    // had already been wiped by clearField(), so it looked like it never
    // appeared despite having clearly collided.
    if (!TUTORIAL_ON || this.hintShown || this.tutShown || this.contShown || this.dead) return;
    const W = this.scale.width, H = this.scale.height;
    const edge = W * (1 - TUTORIAL_REVEAL_X);
    const onScreen = (x) => typeof x === "number" && x <= edge && x > -W * 0.2;

    if (this.spears) {
      for (const sp of this.spears) {
        if (sp.live && onScreen(sp.img.x)) { this.maybeTutorial("spear"); return; }
      }
    }
    // The eagle dives in from above the top edge, so an x-only test fired
    // its hint while it was still off-screen -- by the time play resumed it
    // had already flown past, which looked like it vanished.
    const visible = (o) => o && onScreen(o.x) && o.y > 0 && o.y < H;
    if (this.eagleOn && this.eagle && visible(this.eagle)) { this.maybeTutorial("eagle"); return; }
    if (this.handState === "rising" && onScreen(this.handX)) { this.maybeTutorial("hand"); return; }
    if (this.pickOn && onScreen(this.pickX)) { this.maybeTutorial("shield", "shieldicon"); return; }
    if (this.coins) {
      for (const c of this.coins) {
        if (c.live && c.mode !== 2 && onScreen(c.img.x)) { this.maybeTutorial("coin"); return; }
      }
    }
    // Wind has nothing on screen to walk past, so trigger it once the gust
    // is strong enough that the edge glow is clearly visible.
    const windStrength = Math.max(
      Math.abs(Math.max(this.gust, 0)) / WIND_DOWN_MAX,
      Math.abs(Math.min(this.gust, 0)) / WIND_UP_MAX
    );
    if (windStrength > 0.55) this.maybeTutorial("wind", null);
  }

  // Called when an enemy type first appears. Only during the first
  // TUTORIAL_RUNS runs, and only once per type ever.
  maybeTutorial(key, spriteKey) {
    if (!TUTORIAL_ON) return;
    // Hints belong to practice mode only. A normal run is never
    // interrupted, however new the player is.
    if (!practiceMode) return;
    // Never start a new hint while a death/continue popup already owns the
    // screen -- see the note in checkTutorialReveal for why this matters.
    if (this.contShown) return;
    // Always respect "already shown" -- without this every one of the ten
    // coins in a wave fired its own hint. Practice mode re-teaches by
    // clearing this record at the start of each run, not by ignoring it.
    if (this.tutSeen[key]) return;
    const card = TUTORIAL_CARDS[key];
    if (!card) return;
    this.tutSeen[key] = 1;
    markTutorialCardSeen(key);
    this.rewindForHint(key);
    const sk = spriteKey || key;
    if (this.hintShown || this.tutShown) {
      this.hintQueue.push({ key: sk, card });
      return;
    }
    this.showHint(sk, card);
  }

  layoutGameOver() {
    const W = this.scale.width, H = this.scale.height;
    const pw = W * 0.82, ph = H * 0.56;
    const px = W * 0.5, py = H * 0.5;
    const left = px - pw / 2, right = px + pw / 2;
    const pad = pw * 0.08;
    const r = ph * 0.07;

    // Soft outer glow so the panel lifts off the game behind it.
    this.overGlow.clear();
    this.overGlow.fillStyle(0xffe9a8, 0.10);
    this.overGlow.fillRoundedRect(left - pad * 0.35, py - ph / 2 - pad * 0.35, pw + pad * 0.7, ph + pad * 0.7, r * 1.3);

    this.overPanel.clear();
    this.overPanel.fillStyle(0x081722, 0.97);
    this.overPanel.fillRoundedRect(left, py - ph / 2, pw, ph, r);
    this.overPanel.fillGradientStyle(0xffffff, 0xffffff, 0x9fc4dc, 0x9fc4dc, 0.07, 0.07, 0.0, 0.0);
    this.overPanel.fillRoundedRect(left, py - ph / 2, pw, ph * 0.34, { tl: r, tr: r, bl: 0, br: 0 });
    this.overPanel.lineStyle(Math.max(1, Math.round(ph * 0.005)), 0xffe9a8, 0.75);
    this.overPanel.strokeRoundedRect(left, py - ph / 2, pw, ph, r);

    this.overTitle.setPosition(px, py - ph * 0.40);
    fitTextWidth(this.overTitle, ph * 0.095, pw * 0.85, 14);
    this.gild(this.overTitle, "#ffe9a8", "#c99a3f");

    const rowFont = ph * 0.052;
    const valFont = ph * 0.072;
    const innerL = left + pad, innerR = right - pad;

    // Row 1: distance
    const distY = py - ph * 0.20;
    this.overDistLabel.setPosition(innerL, distY);
    fitTextWidth(this.overDistLabel, rowFont, pw * 0.4, 10);
    this.overDistVal.setPosition(innerR, distY);
    fitTextWidth(this.overDistVal, valFont, pw * 0.45, 12);

    // Row 2: coins (icon + "x N" + what they were worth)
    const coinY = py - ph * 0.07;
    let labelX = innerL;
    if (this.overCoinIcon && this.overCoinIcon.frame && this.overCoinIcon.frame.height) {
      const ih = ph * 0.075;
      this.overCoinIcon.setScale(ih / this.overCoinIcon.frame.height);
      this.overCoinIcon.setPosition(innerL, coinY);
      labelX = innerL + this.overCoinIcon.displayWidth + pw * 0.025;
    }
    this.overCoinLabel.setPosition(labelX, coinY);
    fitTextWidth(this.overCoinLabel, rowFont, pw * 0.42, 10);
    this.overCoinVal.setPosition(innerR, coinY);
    fitTextWidth(this.overCoinVal, valFont, pw * 0.45, 12);

    // Divider
    const ruleY = py + ph * 0.015;
    this.overRule.clear();
    this.overRule.lineStyle(Math.max(1, Math.round(ph * 0.004)), 0xffe9a8, 0.35);
    this.overRule.beginPath();
    this.overRule.moveTo(innerL, ruleY);
    this.overRule.lineTo(innerR, ruleY);
    this.overRule.strokePath();

    // Row 3: grand total
    const totalY = py + ph * 0.11;
    this.overTotalLabel.setPosition(innerL, totalY);
    fitTextWidth(this.overTotalLabel, ph * 0.058, pw * 0.4, 11);
    this.overScoreTxt.setPosition(innerR, totalY);
    fitTextWidth(this.overScoreTxt, ph * 0.115, pw * 0.5, 16);
    this.gild(this.overScoreTxt, "#fff3d0", "#e0c27a");

    this.overStatusTxt.setWordWrapWidth(pw * 0.84);
    this.overStatusTxt.setPosition(px, py + ph * 0.245);
    fitTextWidth(this.overStatusTxt, ph * 0.046, pw * 0.84, 11);

    // Touch-friendly minimum: never let a button's tap target shrink below
    // ~44 CSS px worth of device pixels, even on a tiny popup.
    const minTouch = Math.max(44 * (window.devicePixelRatio || 1), H * 0.07);
    const bw = pw * 0.4, bh = Math.max(ph * 0.13, minTouch);

    const restartX = px - pw * 0.23, restartY = py + ph * 0.38;
    this.overRestartImg.setPosition(restartX, restartY);
    if (this.overRestartUsesTexture) {
      const raw = this.textures.get("restartbtn").getSourceImage();
      const s = Math.min(bw / raw.width, bh / raw.height);
      bakeImageTo(this, this.overRestartImg, "restartbtn", "restartbtn_baked", raw.width * s, raw.height * s, "_overRestartBaked");
    } else {
      paintButton(this.overRestartImg, bw, bh, BTN_GOLD_TOP, BTN_GOLD_BOT, BTN_GOLD_LINE);
      this.overRestartTxt.setPosition(restartX, restartY);
      fitTextWidth(this.overRestartTxt, bh * 0.36, bw * 0.85, 11);
    }
    this.overRestartRect = { x: restartX - bw / 2, y: restartY - bh / 2, w: bw, h: bh };

    const menuX = px + pw * 0.23, menuY = py + ph * 0.38;
    this.overMenuImg.setPosition(menuX, menuY);
    if (this.overMenuUsesTexture) {
      const raw = this.textures.get("menubtn").getSourceImage();
      const s = Math.min(bw / raw.width, bh / raw.height);
      bakeImageTo(this, this.overMenuImg, "menubtn", "over_menubtn_baked", raw.width * s, raw.height * s, "_overMenuBaked");
    } else {
      paintButton(this.overMenuImg, bw, bh, BTN_TEAL_TOP, BTN_TEAL_BOT, BTN_TEAL_LINE);
      this.overMenuTxt.setPosition(menuX, menuY);
      fitTextWidth(this.overMenuTxt, bh * 0.36, bw * 0.85, 11);
    }
    this.overMenuRect = { x: menuX - bw / 2, y: menuY - bh / 2, w: bw, h: bh };
  }

  overGroup() {
    return [this.overGlow, this.overPanel, this.overTitle, this.overDistLabel, this.overDistVal,
            this.overCoinIcon, this.overCoinLabel, this.overCoinVal, this.overRule,
            this.overTotalLabel, this.overScoreTxt, this.overStatusTxt,
            this.overRestartImg, this.overMenuImg].filter(Boolean);
  }

  // Counts a number up over `ms`, easing out, calling back each frame.
  countUp(from, to, ms, onStep, onDone) {
    const startedAt = this.time.now;
    const ev = this.time.addEvent({
      delay: 16, loop: true,
      callback: () => {
        const t = Phaser.Math.Clamp((this.time.now - startedAt) / ms, 0, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        onStep(Math.round(from + (to - from) * eased));
        if (t >= 1) { ev.remove(); if (onDone) onDone(); }
      }
    });
    this.overTimers.push(ev);
    return ev;
  }

  showGameOverPopup(distScore, coins, coinScore, total) {
    this.overShown = true;
    // The pause control has no meaning once the run is over.
    if (this.pauseBtn) this.pauseBtn.setVisible(false);
    this.overTimers = this.overTimers || [];
    this.veil.setVisible(true);
    this.overGroup().forEach(o => o.setVisible(true));
    this.overRestartTxt.setVisible(!this.overRestartUsesTexture);
    this.overMenuTxt.setVisible(!this.overMenuUsesTexture);

    this.overDistVal.setText("0");
    this.overCoinLabel.setText("x " + coins);
    this.overCoinVal.setText("0");
    this.overScoreTxt.setText("0");
    this.overStatusTxt.setText("");
    this.layoutGameOver();

    // Panel entrance: a quick pop-in so it feels alive rather than snapping.
    const group = this.overGroup();
    group.forEach(o => { o.setAlpha(0); });
    this.tweens.add({ targets: group, alpha: 1, duration: 220, ease: "Quad.easeOut" });

    // Juicy tally: distance counts up, then coins, then the grand total,
    // each with a little scale punch as it lands.
    const punch = (obj, s) => {
      if (!obj) return;
      const base = obj.scaleX;
      this.tweens.add({ targets: obj, scaleX: base * s, scaleY: base * s, duration: 110, yoyo: true, ease: "Quad.easeOut" });
    };

    this.countUp(0, distScore, 620, (v) => {
      if (this.overShown) this.overDistVal.setText(comma(v));
    }, () => {
      if (!this.overShown) return;
      punch(this.overDistVal, 1.18);
      this.countUp(0, coinScore, coins > 0 ? 520 : 1, (v) => {
        if (this.overShown) this.overCoinVal.setText(comma(v));
      }, () => {
        if (!this.overShown) return;
        if (coins > 0) { punch(this.overCoinVal, 1.18); punch(this.overCoinIcon, 1.3); }
        this.countUp(0, total, 700, (v) => {
          if (!this.overShown) return;
          this.overScoreTxt.setText(comma(v));
          this.gild(this.overScoreTxt, "#fff3d0", "#e0c27a");
        }, () => {
          if (!this.overShown) return;
          punch(this.overScoreTxt, 1.24);
          this.blast(this.overScoreTxt.x, this.overScoreTxt.y, 14);
        });
      });
    });

    saveScoreAfterRun(total, (msg) => {
      if (this.overShown) this.overStatusTxt.setText(msg);
    });
  }

  hideGameOverPopup() {
    this.overShown = false;
    if (this.pauseBtn) this.pauseBtn.setVisible(true);
    (this.overTimers || []).forEach(ev => ev.remove());
    this.overTimers = [];
    this.veil.setVisible(false);
    this.overGroup().forEach(o => o.setVisible(false));
    this.overRestartTxt.setVisible(false);
    this.overMenuTxt.setVisible(false);
  }

  hitGameOver(gx, gy) {
    if (!this.overShown) return false;
    const r = this.overRestartRect;
    if (r && gx >= r.x && gx <= r.x + r.w && gy >= r.y && gy <= r.y + r.h) {
      this.hideGameOverPopup();
      this.reset();
      return true;
    }
    const m = this.overMenuRect;
    if (m && gx >= m.x && gx <= m.x + m.w && gy >= m.y && gy <= m.y + m.h) {
      this.hideGameOverPopup();
      this.scene.start("Menu");
      return true;
    }
    return true; // swallow taps outside the buttons too, while the popup is open
  }

  gild(t, top, bot) {
    const h = t.height;
    if (!h) return;
    const grd = t.context.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, top);
    grd.addColorStop(0.5, top);
    grd.addColorStop(1, bot);
    t.setFill(grd);
  }

  fancyLine(px, py, pw, ph) {
    const g = this.line.clear();
    const x1 = px + pw * PLATE_LINE_X, x2 = px + pw * PLATE_LINE_END;
    const y = py + ph * PLATE_LINE_Y;
    const span = x2 - x1;
    const thick = Math.max(1, ph * 0.03);
    const segs = 28;
    for (let i = 0; i < segs; i++) {
      const a = i / segs, b = (i + 1) / segs;
      const fade = Math.sin(Math.PI * (a + b) * 0.5);
      g.lineStyle(thick * (0.3 + fade * 0.7), LINE_COLOR, 0.12 + fade * 0.68);
      g.beginPath();
      g.moveTo(x1 + span * a, y);
      g.lineTo(x1 + span * b, y);
      g.strokePath();
    }
    const gem = ph * 0.085;
    const kite = (cx, r, col, al) => {
      g.fillStyle(col, al);
      g.beginPath();
      g.moveTo(cx, y - r);
      g.lineTo(cx + r * 0.6, y);
      g.lineTo(cx, y + r);
      g.lineTo(cx - r * 0.6, y);
      g.closePath();
      g.fillPath();
    };
    kite(x1 + span * 0.5, gem, LINE_GEM, 0.9);
    kite(x1, gem * 0.45, LINE_COLOR, 0.5);
    kite(x2, gem * 0.45, LINE_COLOR, 0.5);
  }

  showBest() {
    this.hiTxt.setText(BEST_LABEL + comma(this.best));
    this.squeeze(this.hiTxt, this.plateW * BEST_MAX_W);
    this.gild(this.hiTxt, BEST_TOP, BEST_BOT);
  }

  sayScore(n) {
    const s = comma(n);
    if (s === this.scoreTxt) return;
    this.scoreTxt = s;
    this.hud.setText(s);
    this.squeeze(this.hud, this.plateW * SCORE_MAX_W);
    this.gild(this.hud, SCORE_TOP, SCORE_BOT);
    this.hudFit = this.hud.scaleX;
    this.hudScale();
  }

  drawHud() {
    const g = this.gauge;
    const W = this.scale.width, H = this.scale.height;
    const u = this.unit;
    g.clear();

    const bx = W - u * BAR_PAD;

    if (!this.badge) return;

    const on = this.shieldT > 0;
    this.badge.setVisible(on);
    if (!on) return;

    const iy = H * BADGE_Y;
    const frac = Phaser.Math.Clamp(this.shieldT / SHIELD_TIME, 0, 1);
    const low = this.shieldT < SHIELD_LOW;
    const rr = this.badge.displayHeight * 0.8;

    this.badge.setPosition(bx, iy).setAlpha(low && Math.sin(this.t * 26) < 0 ? 0.4 : 1);

    g.lineStyle(u * 3.4, 0x07243a, 0.55).strokeCircle(bx, iy, rr);
    g.lineStyle(u * 3.4, low ? 0xff9c5a : 0x74e4ff, 0.95);
    g.beginPath();
    g.arc(bx, iy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac, false);
    g.strokePath();
  }

  doZip() {
    // zipG is SHARED: doBits (hit/coin sparks) and doRings (spear-lock
    // shockwaves) draw into it right after this runs. It must therefore be
    // cleared unconditionally every frame -- skipping the clear when the
    // boost trail happened to be empty left every spark and ring painted on
    // top of the previous frame forever, which looked like garbage, and the
    // ever-growing geometry caused the lag and eventual crash.
    this.zipG.clear();
    const s = this.bst;
    if (s <= 0) return;

    const hw = this.arrow.displayWidth * 0.5, hh = this.arrow.displayHeight * 0.5;
