    for (let i = 0; i < Math.max(2, Math.round(14 * s * this.qual)); i++) {
      const y = this.arrow.y + Phaser.Math.FloatBetween(-hh, hh);
      const x = this.arrow.x - hw * 0.08 - Phaser.Math.FloatBetween(0, hw * 1.3);
      const len = Phaser.Math.FloatBetween(hw * 0.6, hw * 2.2) * (0.4 + 0.6 * s);
      const wid = Phaser.Math.FloatBetween(1.2, 3.6) * this.unit;
      const a = Phaser.Math.FloatBetween(0.12, 0.5) * s;
      this.seg.setTo(x, y, x - len * 0.32, y);
      this.zipG.lineStyle(wid, 0xcaf7ff, a).strokeLineShape(this.seg);
      this.seg.setTo(x - len * 0.32, y, x - len, y);
      this.zipG.lineStyle(wid * 0.7, 0x00d6ff, a * 0.5).strokeLineShape(this.seg);
    }

    for (let i = 0; i < Math.round(5 * s * this.qual); i++) {
      const cx = this.arrow.x - Phaser.Math.FloatBetween(hw * 0.15, hw * 1.7);
      const cy = this.arrow.y + Phaser.Math.FloatBetween(-hh * 0.85, hh * 0.85);
      const cs = hh * Phaser.Math.FloatBetween(0.16, 0.44);
      this.zipG.lineStyle(1.7 * this.unit, 0x66ecff, 0.32 * s);
      this.zipG.beginPath();
      this.zipG.moveTo(cx - cs, cy - cs * 0.75);
      this.zipG.lineTo(cx, cy);
      this.zipG.lineTo(cx - cs, cy + cs * 0.75);
      this.zipG.strokePath();
    }

    for (let i = 0; i < Math.round(5 * s * this.qual); i++) {
      const sx = this.arrow.x - Phaser.Math.FloatBetween(0, hw * 2.1);
      const sy = this.arrow.y + Phaser.Math.FloatBetween(-hh, hh);
      this.zipG.fillStyle(0xffffff, Phaser.Math.FloatBetween(0.2, 0.7) * s)
        .fillCircle(sx, sy, Phaser.Math.FloatBetween(0.8, 2.3) * this.unit);
    }
  }

  doSpin() {
    this.spinG.clear();
    const rate = Math.abs(this.spin);
    if (rate < 0.15) return;

    const p = Phaser.Math.Clamp(rate / SPIN_START, 0, 1);
    const way = this.spin >= 0 ? 1 : -1;
    const r = this.arrow.displayHeight * 0.55;

    for (let i = 0; i < 3; i++) {
      const a0 = this.arrow.rotation - way * i * 0.55;
      this.spinG.lineStyle(Math.max(2, 7 * p * this.unit) * (1 - i * 0.22), 0xffd9a0, 0.5 * p * (1 - i * 0.3));
      this.spinG.beginPath();
      this.spinG.arc(this.arrow.x, this.arrow.y, r + i * r * 0.18, a0, a0 + way * (0.5 + 1.6 * p), way < 0);
      this.spinG.strokePath();
    }
  }

  update(skip, delta) {
    if (delta > HITCH) return;
    if (this.halt) return;
    const real = Math.min(delta / 1000, 1 / 30);
    this.born += real;

    if (this.born > WARMUP) {
      if (delta > 1000 / LOW_FPS) this.slowFor += real;
      else this.slowFor = Math.max(0, this.slowFor - real * 0.5);
    }
    if (this.slowFor > LOW_HOLD && this.qual === 1) {
      this.qual = QUAL_LOW;
      this.slowFor = 0;
    }
    if (this.slowT > 0) this.slowT -= real;
    const dt = real * (this.caught ? BREAK_SLOW : this.slowT > 0 ? HIT_SLOW : 1);

    this.bst = (this.dead || this.caught || this.stall) ? 0 : this.boostAmt();
    if (!this.dead && !this.caught) this.spd = Math.min(this.spd + BG_ACCEL * dt, BG_MAX);

    if (this.dead || this.caught) { if (this.arrow.anims.isPlaying) this.arrow.anims.pause(); }
    else if (!this.arrow.anims.isPlaying) this.arrow.anims.resume();

    if (this.safeT > 0) {
      this.safeT -= real;
      this.arrow.setAlpha(this.safeT > 0 && Math.sin(this.t * 45) > 0 ? 0.45 : 1);
    }

    this.drawHud();

    if (this.tutorialIcon) {
      this.tutorialIcon.setVisible(this.caught || (this.dist * KM_PER_PX < TUTORIAL_KM));
    }

    if (this.dead) this.brake = Math.max(0, this.brake - DEATH_BRAKE * dt);
    const go = this.spd * (1 + (BOOST - 1) * this.bst);
    const roll = go * this.unit * this.brake;

    this.tiles.forEach(t => {
      t.x -= roll * dt;
      if (t.x <= -this.tw) t.x += this.tw * this.tiles.length;
    });

    this.doSpears(dt, roll);
    this.doShield(dt, roll);
    this.doEagle(dt, roll);
    this.doHand(dt, roll);
    this.doCoins(dt, roll);

    if (this.caught) {
      this.doStruggle(dt, real, roll);
      this.doZip();
      this.doBits(dt, roll);
      this.doRings(dt, roll);
      this.doAir(dt, roll);
      this.doSpin();
      if (this.caught) this.drawGrip();
      this.drawTapHint();
      return;
    }

    if (this.dead) {
      this.doFall(dt, roll);
      this.doZip();
      this.doBits(dt, roll);
      this.doRings(dt, roll);
      this.doAir(dt, roll);
      this.doSpin();
      return;
    }

    this.gustT -= dt;
    if (this.gustT <= 0) this.newGust();
    this.gust = Phaser.Math.Linear(this.gust, this.want, 1 - Math.pow(0.05, dt));
    this.doAir(dt, roll);

    this.vy += (GRAVITY + this.gust) * dt;
    this.arrow.y += this.vy * this.unit * dt;

    if (!this.stall) {
      this.up = Math.max(this.up - CLIMB_DECAY * dt, 0);
      const dive = this.vy > 0 ? Math.min(this.vy / 850, 1) * MAX_DIVE : 0;
      const aim = Phaser.Math.Clamp(FLAT + dive - this.up * MAX_CLIMB, FLAT - MAX_PITCH, FLAT + MAX_PITCH);
      this.arrow.rotation = Phaser.Math.Linear(this.arrow.rotation, aim, 1 - Math.pow(0.001, dt));
      this.arrow.rotation = Phaser.Math.Clamp(this.arrow.rotation, FLAT - MAX_PITCH, FLAT + MAX_PITCH);
      this.back = Math.max(this.back + (this.up * PUSHBACK - RECOVER * (1 - this.up)) * dt, 0);
      this.arrow.x = this.homeX - this.back * this.unit;

      if (this.safeT <= 0 && this.arrow.rotation <= FLAT - Math.PI / 2 + STALL_ANGLE) {
        this.stall = true;
        this.vy = Math.max(this.vy, 0);
        this.spin = (this.gust >= 0 ? 1 : -1) * SPIN_START * Phaser.Math.FloatBetween(0.85, 1.3);
      }
    } else {
      this.spin += this.gust * SPIN_WIND * dt * 60;
      this.spin += Math.sin(this.t * 9.3) * 0.9 * dt;
      this.spin *= Math.pow(SPIN_DRAG, dt);
      this.arrow.rotation += this.spin * dt;

      const drop = FLAT + Math.min(this.vy / 850, 1) * MAX_DIVE;
      const calm = Phaser.Math.Clamp(1 - Math.abs(this.spin) / 2.5, 0, 1);
      if (calm > 0) this.arrow.rotation = Phaser.Math.Angle.RotateTo(this.arrow.rotation, drop, VANE_GRIP * calm * dt);
      this.arrow.x += this.gust * WIND_DRIFT * this.unit * dt;
    }

    const half = this.arrow.displayHeight / 2;

    const roof = half * (1 - 2 * CEIL_OVER);

    if (!this.slam && this.arrow.y < roof) {
      this.slam = true;
      this.up = 0;
      this.vy = Math.max(this.vy, CEIL_SNAP);
    }

    if (this.slam) {
      this.up = 0;
      this.vy += CEIL_SLAM * dt;
      if (this.arrow.y > roof + this.scale.height * CEIL_SAFE) this.slam = false;
    }

    if (this.intro) {
      this.vy = 0;
      this.up = 0;
      this.spin = 0;
      this.stall = false;
      this.slam = false;
      this.arrow.rotation = FLAT;
      this.arrow.y = this.scale.height * 0.4 + Math.sin(this.t * INTRO_BOB_RATE) * this.scale.height * INTRO_BOB;
      if (this.dist * KM_PER_PX >= INTRO_KM) {
        this.intro = false;
      }
    }

    const foot = this.arrow.displayHeight * ARROW_FOOT;
    if (this.arrow.y + foot > this.groundY) {
      if (this.safeT <= 0) return this.bail();
      this.arrow.y = this.groundY - foot;
      this.vy = Math.min(this.vy, BREAK_KICK * 0.45);
    }
    if (this.arrow.x + half < 0) return this.bail("the wind blew you away");

    this.t += dt;
    this.dist += this.spd * (1 + (SCORE_BOOST - 1) * this.bst) * dt;
    this.scoreT += dt;
    if (this.scoreT >= SCORE_TICK) {
      this.scoreT = 0;
      this.sayScore(Math.floor(this.dist * KM_PER_PX * SCORE_UNIT));
    }

    this.doZip();
    this.doBits(dt, roll);
    this.doRings(dt, roll);
    this.doSpin();
    this.drawTapHint();
    this.checkTutorialReveal();
    this.runScript(dt);

    // Safety net: practice mode is meant to be unloseable, so if anything
    // ever leaves the arrow tumbling out of the play area, recover rather
    // than letting the run continue in a broken state.
    if (practiceMode && !this.dead && !this.caught) {
      const W = this.scale.width, H = this.scale.height;
      const off = this.arrow.x < -W * 0.1 || this.arrow.x > W * 1.1 ||
                  this.arrow.y < -H * 0.3 || this.arrow.y > H * 1.2;
      if (off || Math.abs(this.spin) > SPIN_START * 6) this.practiceRecover();
    }
  }
}

let res = Math.max(RES_MIN, Math.min(window.devicePixelRatio || 1, RES_MAX));

const game = new Phaser.Game({
  // Force WebGL rather than AUTO: AUTO can silently fall back to the Canvas
  // renderer, which does all compositing on the CPU and is dramatically
  // slower for this many sprites. Phaser still falls back on its own if
  // WebGL is genuinely unavailable.
  type: Phaser.WEBGL,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: "#06121c",
  // Phaser's own sound manager stays disabled (we use plain HTML5 Audio via
  // Snd, which is cheaper and off the main thread), but audio must not be
  // globally disabled or the intro videos would stay silent.
  audio: { disableWebAudio: true },
  render: {
    antialias: true,
    antialiasGL: true,
    roundPixels: true,
    powerPreference: "high-performance",
    batchSize: 4096,
    // The canvas is fully repainted every frame, so the GPU never needs to
    // preserve the previous buffer -- turning this off avoids a per-frame
    // copy.
    preserveDrawingBuffer: false,
    failIfMajorPerformanceCaveat: false,
    // Nothing is drawn behind the canvas, so an opaque context lets the
    // compositor skip per-pixel blending against the page.
    transparent: false,
    clearBeforeRender: true
  },
  fps: { target: 60, smoothStep: true },
  parent: "holder",
  scale: { mode: Phaser.Scale.NONE, autoCenter: Phaser.Scale.CENTER_OFF },
  scene: [LoadScene, MenuScene, LeaderboardScene, ArrowFlight]
});

const holder = document.getElementById("holder");

function tall() {
  return window.innerHeight > window.innerWidth;
}

let boxW = 0, boxH = 0, turned = false;
let resettleRAF = null;
let resettleTimeouts = [];

function shape() {
  if (!game.scale || !live) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const sideways = tall();
  const w = sideways ? vh : vw;
  const h = sideways ? vw : vh;
  holder.style.width = w + "px";
  holder.style.height = h + "px";
  holder.style.transform = "translate(-50%,-50%)" + (sideways ? " rotate(90deg)" : "");
  void holder.offsetHeight;
  boxW = w;
  boxH = h;
  turned = sideways;
  const rw = Math.round(w * res), rh = Math.round(h * res);
  if (game.scale.width !== rw || game.scale.height !== rh) game.scale.resize(rw, rh);
  if (live.ready && typeof live.fit === "function") {
    try { live.fit(); } catch (e) {}
  }
}

function clearResettle() {
  if (resettleRAF !== null) {
    cancelAnimationFrame(resettleRAF);
    resettleRAF = null;
  }
  resettleTimeouts.forEach(id => clearTimeout(id));
  resettleTimeouts = [];
}

function resettle() {
  clearResettle();
  shape();
  resettleRAF = requestAnimationFrame(shape);
  resettleTimeouts.push(setTimeout(shape, 60));
  resettleTimeouts.push(setTimeout(shape, 220));
}

let lastPoke = 0;

function spot(e) {
  const t = e && e.touches && e.touches[0] ? e.touches[0] : e;
  if (!t || t.clientX === undefined) return null;
  const dx = t.clientX - window.innerWidth / 2;
  const dy = t.clientY - window.innerHeight / 2;
  const lx = turned ? dy : dx;
  const ly = turned ? -dx : dy;
  return { x: (lx + boxW / 2) * res, y: (ly + boxH / 2) * res };
}

function poke(e) {
  const now = Date.now();
  if (now - lastPoke < 70) return;
  lastPoke = now;
  if (!live) return;
  const p = spot(e);
  if (live.kind === "game") {
    // The opening card fully pauses the run and is dismissed only by its
    // CONTINUE button, so it swallows every tap while it's up.
    if (live.contShown) { if (p) live.hitContinue(p.x, p.y); return; }
    if (live.tutShown) { if (p) live.hitTutorial(p.x, p.y); return; }
    // A hint pauses the game and waits for a tap; that tap only dismisses
    // it, it doesn't also flap.
    if (live.hintShown) { if (live.tutTapAllowed()) live.hideHint(); return; }
    if (p && live.hitPause(p.x, p.y)) return;
    if (live.halt) {
      if (p) live.hitPopup(p.x, p.y);
      return;
    }
    if (live.dead) {
      if (p) live.hitGameOver(p.x, p.y);
      return;
    }
    live.tap();
    return;
  }
  if (typeof live.handleTap === "function") live.handleTap(p);
}

function hit(e) {
  if (e && e.cancelable) e.preventDefault();
  poke(e);
}

document.addEventListener("pointerdown", hit);

// PWA: register the service worker so the game is installable and works
// offline. Only meaningful over http/https, and every failure is ignored
// so a missing sw.js can never affect the game.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// When the tab is backgrounded, silence audio and let Phaser idle instead
// of continuing to render and decode in the background. Saves battery and
// stops music playing over whatever the player switched to.
document.addEventListener("visibilitychange", () => {
  const hidden = document.hidden;
  try {
    if (Snd.music) {
      if (hidden) Snd.music.pause();
      else { const r = Snd.music.play(); if (r && r.catch) r.catch(() => {}); }
    }
  } catch (e) {}
  try {
    if (game && game.loop) {
      if (hidden) game.loop.sleep();
      else game.loop.wake();
    }
  } catch (e) {}
});
document.addEventListener("touchstart", hit, { passive: false });
document.addEventListener("mousedown", hit);

window.addEventListener("resize", shape);
window.addEventListener("orientationchange", () => setTimeout(shape, 140));
game.events.once("ready", shape);
setTimeout(shape, 80);
</script>
</body>
</html>
